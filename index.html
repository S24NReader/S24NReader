<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S24NReader — قارئ الأخبار</title>
<meta name="description" content="قارئ أخبار وخلاصات RSS عربي: تابع مصادرك في مكان واحد.">
<meta name="theme-color" content="#0f7b4b">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f7b4b'/%3E%3Ctext x='32' y='41' font-family='Arial,Helvetica,sans-serif' font-size='25' font-weight='700' fill='%23fff' text-anchor='middle' letter-spacing='-1'%3ES24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   S24NReader v1.0 — قارئ خلاصات عربي (ملف واحد)
   ========================================================= */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --side:#f0f2ef; --line:#e3e6e1; --line2:#eef0ec;
  --tx:#1b1f1c; --tx2:#5b635d; --tx3:#8a918b;
  --ac:#0f7b4b; --ac2:#e3f2ea; --ac3:#0a5c38;
  --star:#d99a00; --later:#2f6fd6; --danger:#c2362b;
  --sel:#e8f3ec; --hover:#f3f5f2; --unread:#0f7b4b;
  --shadow:0 10px 30px rgba(20,30,25,.12), 0 2px 6px rgba(20,30,25,.06);
  --r:10px; --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
[data-theme="dark"]{
  --bg:#121513; --panel:#181c19; --side:#141815; --line:#262b27; --line2:#1f2420;
  --tx:#e7ebe8; --tx2:#a5ada7; --tx3:#727a74;
  --ac:#3cc38a; --ac2:#173426; --ac3:#62d6a3;
  --sel:#1b2b22; --hover:#1d221e; --unread:#3cc38a;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--ac)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* ---------- الهيكل ---------- */
#app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap;min-width:200px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.5px}
.brand b{color:var(--ac)}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 38px 0 12px;outline:none}
.search input:focus{border-color:var(--ac);background:var(--panel)}
.search .ico{position:absolute;right:11px;top:10px;color:var(--tx3)}
.top-acts{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.ibtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--tx2)}
.ibtn:hover{background:var(--hover);color:var(--tx)}
.ibtn.on{color:var(--ac)}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac3)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

.main{--w-side:260px;--w-list:400px;display:grid;grid-template-columns:var(--w-side) var(--w-list) minmax(0,1fr);min-height:0;position:relative}
.main.wide-list{grid-template-columns:var(--w-side) 1fr 0}
/* مقابض تغيير عرض الأعمدة */
.col-rs{position:absolute;top:0;bottom:0;width:9px;margin-right:-5px;z-index:6;cursor:col-resize;touch-action:none}
.col-rs::after{content:'';position:absolute;top:0;bottom:0;right:3px;width:3px;background:var(--ac);opacity:0;transition:opacity .12s}
.col-rs:hover::after,.col-rs.on::after{opacity:1}
#rs-side{right:var(--w-side)}
#rs-list{right:calc(var(--w-side) + var(--w-list))}
.main.wide-list #rs-list,.main.cards-mode #rs-list{display:none}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing iframe,body.col-resizing .reader{pointer-events:none}
/* سحب المصادر */
.nav-i.drag-ghost{position:fixed;margin:0;z-index:1000;pointer-events:none;opacity:.85;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);direction:rtl}
.drop-line{position:fixed;z-index:999;height:2px;background:var(--ac);pointer-events:none;border-radius:2px}
.drop-line::before{content:'';position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.nav-i.drop-in{outline:2px solid var(--ac);outline-offset:-2px;background:var(--ac2)}
.nav-i.dragging-src{opacity:.35}
body.feed-dragging{cursor:grabbing;user-select:none}
body.feed-dragging .nav-i:hover{background:none}
/* ---------- الشريط الجانبي ---------- */
.side{background:var(--side);border-left:1px solid var(--line);overflow:auto;padding:10px 8px 40px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--tx2);cursor:pointer;user-select:none;position:relative}
.nav-i:hover{background:var(--hover);color:var(--tx)}
.nav-i.act{background:var(--sel);color:var(--tx);font-weight:600}
.nav-i .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .cnt{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.nav-i.has-unread .cnt{color:var(--ac);font-weight:600}
.nav-i .more{opacity:0;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--tx3)}
.nav-i:hover .more{opacity:1}
.nav-i .more:hover{background:var(--line)}
.nav-i img.fav{width:16px;height:16px;border-radius:3px;flex:none}
.nav-i .fico{display:grid}
.nav-i .sw{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}
.nav-i.off{opacity:.5}
.nav-i .err{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--tx3);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.side h4 span{display:flex;gap:2px}
.side h4 button{color:var(--tx3);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.side h4 button:hover{background:var(--line);color:var(--tx)}
.folder>.nav-i .chev{transition:transform .15s;width:14px;height:14px}
.folder.collapsed>.nav-i .chev{transform:rotate(90deg)}
.folder.collapsed>.kids{display:none}
.kids{padding-inline-start:14px}
.side-foot{margin-top:14px;padding:10px;font-size:12px;color:var(--tx3)}
.side-foot.acct{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.side-foot.acct .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}

/* ---------- قائمة المقالات ---------- */
.list{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-h{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:54px}
.list-h h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:3px 9px;border-radius:6px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.items{overflow:auto;flex:1}
.it{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.it:hover{background:var(--hover)}
.it.sel{background:var(--sel)}
.it.hl::before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--hl,var(--star))}
.it-main{flex:1;min-width:0}
.it-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);margin-bottom:2px}
.it-meta img{width:14px;height:14px;border-radius:3px}
.it-meta .src{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-title{font-size:15px;line-height:1.5;color:var(--tx2);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.unread .it-title{color:var(--tx);font-weight:700}
.it.unread .dot{width:7px;height:7px;border-radius:50%;background:var(--unread);flex:none}
.it-snip{font-size:13px;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.it-th{width:84px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--line2)}
.it-flags{display:flex;gap:4px;align-items:center}
.it-flags .ico{width:14px;height:14px}
.f-star{color:var(--star)} .f-later{color:var(--later)}
.chip{font-size:11px;padding:0 7px;border-radius:20px;background:var(--ac2);color:var(--ac3);white-space:nowrap}
.items.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:auto;gap:14px;padding:14px;align-content:start;align-items:start}
/* البطاقة كتلة عادية (بلا flex) حتى يحسب المتصفح ارتفاعها بدقة فلا تتداخل البطاقات ولا تُقصّ العناوين */
.items.cards .it{display:block;border:1px solid var(--line);border-radius:12px;padding:0}
.items.cards .it-main{padding:12px 14px 14px}
.items.cards .it-title{line-height:1.7;-webkit-line-clamp:3}
.items.cards .it-th{display:block;width:100%;height:140px;border-radius:11px 11px 0 0}
.items.cards .it.hl::before{width:100%;height:3px;bottom:auto}
.empty{padding:50px 24px;text-align:center;color:var(--tx3)}
.empty h3{color:var(--tx);margin:10px 0 6px;font-size:17px}
.empty .ico{width:44px;height:44px;stroke-width:1.3;color:var(--tx3)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}

/* ---------- القارئ ---------- */
.reader{background:var(--panel);overflow:auto;min-width:0}
.r-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:2px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.r-bar .sp{flex:1}
.r-back{display:none}
.art{max-width:760px;margin:0 auto;padding:26px 28px 80px}
.art-src{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:13px}
.art-src img{width:18px;height:18px;border-radius:4px}
.art h1{font-size:27px;line-height:1.45;margin:10px 0 8px}
.art h1 a{color:var(--tx);text-decoration:none}
.art h1 a:hover{color:var(--ac)}
.art-meta{color:var(--tx3);font-size:13px;margin-bottom:20px}
.art-body{font-size:17.5px;line-height:1.95}
.art-body img,.art-body video{max-width:100%;height:auto;border-radius:8px}
.art-body figure{margin:16px 0}
.art-body figcaption{font-size:13px;color:var(--tx3)}
.art-body blockquote{margin:16px 0;padding:6px 16px;border-right:3px solid var(--ac);background:var(--bg);border-radius:6px}
.art-body pre{overflow:auto;background:var(--bg);padding:12px;border-radius:8px;direction:ltr;text-align:left}
.art-lead{width:100%;border-radius:10px;margin-bottom:18px;max-height:440px;object-fit:cover}
.art-note{margin-top:28px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--tx3);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reader-empty{height:100%;display:grid;place-items:center;color:var(--tx3);text-align:center;padding:30px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px;font-family:ui-monospace,monospace}

/* محرر المسودات */
.ed{max-width:820px;margin:0 auto;padding:22px 26px 60px}
.ed input.t{width:100%;font-size:24px;font-weight:700;border:0;outline:none;background:none;padding:6px 0;border-bottom:1px solid var(--line)}
.ed textarea{width:100%;min-height:55vh;border:0;outline:none;background:none;resize:vertical;font-size:17px;line-height:1.9;padding:14px 0}
.ed-src{font-size:13px;color:var(--tx3);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:12px}
.ed-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--tx3);font-size:13px}

/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.mdl{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.mdl.lg{width:min(760px,100%)}
.mdl-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mdl-h h3{margin:0;font-size:17px;flex:1}
.mdl-b{padding:16px 18px;overflow:auto}
.mdl-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.fld .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.in{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 12px;outline:none}
textarea.in{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--ac);background:var(--panel)}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1}
.ltr{direction:ltr;text-align:left}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.box h5{margin:0 0 6px;font-size:14px}
.pv li{font-size:13.5px;color:var(--tx2);margin-bottom:3px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt input{margin-top:5px}
.opt small{display:block;color:var(--tx3);word-break:break-all}
.msg{padding:10px 12px;border-radius:9px;font-size:13.5px;margin-top:10px}
.msg.err{background:#fbe9e7;color:#8f2a20}
[data-theme="dark"] .msg.err{background:#3a1d1a;color:#f2b8b0}
.msg.ok{background:var(--ac2);color:var(--ac3)}
.rule{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rule .sw{width:12px;height:12px;border-radius:50%;flex:none}
.rule .rb{flex:1;min-width:0}
.rule .rb small{display:block;color:var(--tx3)}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.15s}
.toggle input:checked+span{background:var(--ac)}
.toggle input:checked+span::after{right:19px}
/* منتقي الألوان: ألوان جاهزة + لون مخصّص غير محدود */
.cpick{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cpick .sw-c{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);position:relative;padding:0;margin:0}
.cpick .sw-c.on{box-shadow:0 0 0 2px var(--tx)}
.cpick .custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.cpick .custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.cpick .cval{font-size:12px;color:var(--tx3);font-family:ui-monospace,monospace;direction:ltr;margin-inline-start:4px}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:60;min-width:190px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;text-align:right}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast.undo{display:flex;align-items:center;gap:16px;padding:8px 10px 8px 18px}
.toast.undo button{color:#7ee2b0;font-weight:700;padding:4px 10px;border-radius:7px}
.toast.undo button:hover{background:rgba(255,255,255,.1)}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none}
#toasts>*{pointer-events:auto}
.toast{background:#1b1f1c;color:#fff;padding:10px 18px;border-radius:10px;z-index:70;font-size:14px;box-shadow:var(--shadow);animation:fade .15s}
.banner{background:#fff7e0;color:#6b5000;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0e2b0}
[data-theme="dark"] .banner{background:#2d2610;color:#e9d38c;border-color:#463b17}

/* ---------- الدخول ---------- */
.auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:20px}
.auth-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.auth-card .brand{justify-content:center;font-size:21px;margin-bottom:4px}
.auth-card p.sub{text-align:center;color:var(--tx3);margin:0 0 22px}
.or{display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-card .btn{width:100%;justify-content:center;height:42px}
.lnk{color:var(--ac);font-size:13px;cursor:pointer}

/* ---------- الجوال ---------- */
/* وضع البطاقات: الشبكة تأخذ العرض كله، والمقالة تُفتح مكانها مع زر رجوع */
.main.cards-mode{grid-template-columns:var(--w-side) 1fr}
.main.cards-mode .reader{display:none}
.main.cards-mode.reading .list{display:none}
.main.cards-mode.reading .reader{display:block}
.main.cards-mode .r-back{display:grid}
.seg .ico{width:15px;height:15px;display:block}
@media (max-width:1100px){ .main{grid-template-columns:var(--w-side) 1fr} #rs-list{display:none} .main .reader{display:none} .main.reading .list{display:none} .main.reading .reader{display:block} .r-back{display:grid} }
@media (max-width:760px){
  .brand{min-width:0} .brand span{display:none}
  .main{grid-template-columns:1fr} .col-rs{display:none}
  .side{position:fixed;top:56px;bottom:0;right:0;width:82%;max-width:300px;z-index:30;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .art{padding:18px 16px 70px} .art h1{font-size:22px} .art-body{font-size:16.5px}
  .it-th{width:70px;height:56px}
  .r-bar{flex-wrap:nowrap;padding:6px 8px;overflow-x:auto}
  .r-bar .btn .t{display:none}
  .hide-m{display:none!important}
}
@media (min-width:761px){ .only-m{display:none!important} }
</style>
</head>
<body>
<div id="app">
  <header class="top">

// استخراج العناوين من صفحة لا تملك RSS (صفحة قسم أو رئيسية)
const SKIP_PATH = /\/(tag|tags|category|categories|author|authors|page|search|login|signin|signup|register|contact|about|privacy|terms|feed|rss|account|subscribe|newsletter|video-?gallery|live)(\/|$|\?)/i;
function scrapeLinks(doc, pageUrl) {
  const base = new URL(pageUrl); const host = base.hostname.replace(/^www\./, '');
  const found = new Map(); let order = 0;
  for (const a of $$('a[href]', doc)) {
    const href = absUrl(a.getAttribute('href'), pageUrl); if (!href) continue;
    const u = new URL(href); u.hash = '';
    if (!u.hostname.replace(/^www\./, '').endsWith(host)) continue;
    if (u.pathname.length < 2 || u.pathname === base.pathname) continue;
    if (SKIP_PATH.test(u.pathname) || /\.(jpe?g|png|gif|webp|pdf|mp4|mp3|zip)$/i.test(u.pathname)) continue;
    let title = txt(a.querySelector('h1,h2,h3,h4')) || txt(a) || a.getAttribute('title') || (a.querySelector('img') && a.querySelector('img').getAttribute('alt')) || '';
    if (title.length < 20) { // الاستعانة بنص الرابط (slug) كما في مواقع تكتب العنوان في الرابط
      let slug = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '').replace(/\.\w+$/, '').replace(/[-_+]+/g, ' ').trim();
      if (/[؀-ۿ]/.test(slug) || slug.split(' ').length >= 4) title = title.length > slug.length ? title : slug;
    }
    if (title.length < 18 || title.length > 260 || title.split(/\s+/).length < 3) continue;
    let score = 0;
    if (a.closest('h1,h2,h3,h4') || a.querySelector('h1,h2,h3,h4')) score += 3;
    if (a.closest('article')) score += 2;
    if (u.pathname.split('/').filter(Boolean).length >= 2) score += 1;
    if (/\d/.test(u.pathname)) score += 1;
    if (a.closest('nav,header,footer,aside,[role="navigation"],.menu,.footer')) score -= 4;
    if (score < 1) continue;
    const key = u.href;

    let img = a.querySelector('img') || (box && box.querySelector('img'));
    let image = img ? absUrl(img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('src') || '', pageUrl) : '';

    const tEl = box && box.querySelector('time[datetime]');
    const prev = found.get(key);
    if (!prev || score > prev.score || (score === prev.score && title.length > prev.title.length)) {

    }
  }
  return [...found.values()].sort((a, b) => a.order - b.order).slice(0, 60);
}

/* ---------- استخراج النص الكامل من صفحة المقالة ---------- */
function extractArticle(doc, url) {
  $$('script,style,noscript,nav,header,footer,aside,form,iframe,[class*="comment"],[id*="comment"],[class*="related"],[class*="share"],[class*="social"],[class*="newsletter"],[class*="advert"],[class*="promo"]', doc).forEach(e => e.remove());

/* ---------- تحديث مصدر ---------- */
async function refreshFeed(feedId) {
  const feed = S.feeds[feedId]; if (!feed) return;
  FEED_STATUS[feedId] = { ...(FEED_STATUS[feedId] || {}), loading: true };
  try {
    const { text, finalUrl } = await fetchText(feed.url);
    const p = parseDoc(text, finalUrl);
    let raw;
    if (feed.type !== 'html' && p.kind === 'html') throw new Error('الرابط لا يعيد خلاصة RSS صالحة');
    if (feed.type === 'html') {
      if (p.kind !== 'html') throw new Error('تغيّر نوع المصدر');
      raw = scrapeLinks(p.doc, finalUrl);
      if (!raw.length) throw new Error('لم يُعثر على عناوين في الصفحة');
    } else raw = p.items;

    const prevMap = new Map(); for (const it of ITEMS.values()) if (it.feedId === feedId) prevMap.set(it.id, it);
    const now = Date.now(); const fresh = [];
    raw.forEach((r, i) => {
      const id = hash(feedId + '|' + (r.guid || r.link || r.title));
      const prev = prevMap.get(id);
      const firstSeen = prev ? prev.firstSeen : now - i * 1000;
      const html = sanitize(r.html, r.link || finalUrl);
      const item = {
        id, feedId, title: r.title || '(بلا عنوان)', link: r.link, author: r.author || '',
        date: isNaN(r.date) ? firstSeen : Math.min(r.date, now + 3600e3), firstSeen,
        html, text: plain(html).slice(0, 400), image: bigImg(r.image || firstImg(html, r.link || finalUrl)),
      };
      if (!prev) fresh.push(item);
      prevMap.set(id, item);
    });
    const items = [...prevMap.values()].sort((a, b) => b.date - a.date).slice(0, CONFIG.MAX_ITEMS_PER_FEED);
    for (const it of ITEMS.values()) if (it.feedId === feedId) ITEMS.delete(it.id);
    items.forEach(it => ITEMS.set(it.id, it));
    IDB.put({ feedId, items, fetchedAt: now });
    FEED_STATUS[feedId] = { fetchedAt: now, error: '', loading: false };
    if (fresh.length) applyRuleActions(fresh);
  } catch (e) {
    FEED_STATUS[feedId] = { ...(FEED_STATUS[feedId] || {}), error: e.message, loading: false };
  }
  scheduleRender();
}

async function refreshAll() {

let _rulesCache = { v: '', list: [] };

  const v = JSON.stringify(S.rules || {}) + '|' + Object.entries(S.feeds).map(([k, f]) => k + ':' + (f.folder || '')).join(',');
  if (_rulesCache.v !== v) {

  }

let _rq = 0, _rkeys = new Set();
function scheduleRender(key) {

// توقيع محتوى القارئ: يمنع إعادة الرسم (وارتجاف الصور وفقدان موضع التمرير) إن لم يتغير شيء

function setView(v, sel = null) {

function openItem(id) {
  SEL = id; $('#main').classList.add('reading');

  renderList(); renderReader();
  const el = $(`[data-item="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: 'nearest' });

function moveSel(d) {
  const list = currentItems(); if (!list.length) return;

async function loadFullText(id) {
  const it = getItem(id); if (!it || !it.link) return;
  if (FULLTEXT.has(id)) { FULLTEXT.delete(id); return renderReader(); }
  toast('جارٍ جلب النص الكامل…', 1500);
  try {
    const { text, finalUrl } = await fetchText(it.link);
    const p = parseDoc(text, finalUrl); if (p.kind !== 'html') throw new Error('ليست صفحة مقالة');
    const res = extractArticle(p.doc, finalUrl);
    if (!res.html || plain(res.html).length < 150) throw new Error('لم يُعثر على نص المقالة في الصفحة');
    FULLTEXT.set(id, res); if (SEL === id) renderReader();
  } catch (e) { toast('تعذّر: ' + e.message, 3500); }
}

  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);

let AF = null;
async function checkFeedUrl() {
  const res = $('#af-res'); let url = $('#af-url').value.trim(); if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  res.innerHTML = `<div class="msg ok">جارٍ الفحص…</div>`;
  try {
    const { text, finalUrl } = await fetchText(url);
    const p = parseDoc(text, finalUrl);
    if (p.kind === 'feed') { AF = { options: [{ type: 'rss', url: finalUrl, title: p.title, siteUrl: p.siteUrl, items: p.items }] }; return showAfOptions(); }
    const title = txt(p.doc.querySelector('title')).split(/\s[|\-–—]\s/)[0] || hostOf(finalUrl);
    const opts = [];
    let disc = discoverFeeds(p.doc, finalUrl);
    if (!disc.length) { // تجربة المسارات الشائعة
      const o = new URL(finalUrl).origin;
      disc = ['/feed', '/rss', '/rss.xml', '/feed.xml', '/feeds/posts/default?alt=rss'].map(x => ({ title: '', url: o + x }));
    }
    const checks = await Promise.all(disc.slice(0, 6).map(async d => {
      try { const r = await fetchText(d.url); const q = parseDoc(r.text, r.finalUrl); return q.kind === 'feed' && q.items.length ? { type: 'rss', url: r.finalUrl, title: q.title || d.title, siteUrl: q.siteUrl || finalUrl, items: q.items } : null; } catch { return null; }
    }));
    const seen = new Set(); checks.filter(Boolean).forEach(c => { if (!seen.has(c.url)) { seen.add(c.url); opts.push(c); } });
    const scraped = scrapeLinks(p.doc, finalUrl);
    if (scraped.length) opts.push({ type: 'html', url: finalUrl, title, siteUrl: finalUrl, items: scraped });
    if (!opts.length) throw new Error('لم نجد خلاصة RSS ولا عناوين أخبار في هذه الصفحة. جرّب رابط قسم الأخبار مباشرة.');
    AF = { options: opts }; showAfOptions();
  } catch (e) { res.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }

function popMenu(anchor, items) {

  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + 'px';
  m.style.left = Math.max(8, r.left - m.offsetWidth + r.width) + 'px';
  return new Promise(res => {
    const done = k => { m.remove(); document.removeEventListener('mousedown', out, true); res(k); };
    const out = e => { if (!m.contains(e.target)) done(null); };

async function importOpml(file) {
  if (!file) return;
  const x = new DOMParser().parseFromString(await file.text(), 'application/xml');
  if (x.querySelector('parsererror')) return toast('ملف OPML غير صالح');
  const upd = {}; const existing = new Set(Object.values(S.feeds).map(f => f.url)); const folderByName = {};
  Object.entries(S.folders).forEach(([id, f]) => folderByName[f.name] = id);
  let n = 0;
  for (const o of x.querySelectorAll('outline[xmlUrl]')) {
    const url = o.getAttribute('xmlUrl'); if (!url || existing.has(url)) continue; existing.add(url);
    const parent = o.parentElement && o.parentElement.closest('outline:not([xmlUrl])');
    let folder = '';
    if (parent) { const name = parent.getAttribute('title') || parent.getAttribute('text') || 'مجلد'; folder = folderByName[name] || (folderByName[name] = uid()); if (!S.folders[folder] && !upd['folders/' + folder]) upd['folders/' + folder] = { name, order: Date.now() + n }; }
    upd['feeds/' + uid()] = { title: o.getAttribute('title') || o.getAttribute('text') || hostOf(url), url, siteUrl: o.getAttribute('htmlUrl') || '', type: 'rss', folder, addedAt: Date.now() }; n++;
  }
  if (!n) return toast('لا مصادر جديدة في الملف');
  Store.update(upd); closeModal(); toast(`استُورد ${n} مصدر`); renderAll(); refreshAll();
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportOpml() {
  const ex = s => esc(s);
  const row = f => `      <outline type="rss" text="${ex(f.title)}" title="${ex(f.title)}" xmlUrl="${ex(f.url)}" htmlUrl="${ex(f.siteUrl || '')}"/>`;
  let body = Object.entries(S.folders).map(([id, fo]) => `    <outline text="${ex(fo.name)}" title="${ex(fo.name)}">\n${feedsInFolder(id).map(([, f]) => row(f)).join('\n')}\n    </outline>`).join('\n');
  body += '\n' + feedsInFolder('').map(([, f]) => row(f).slice(2)).join('\n');
  download('s24nreader-subscriptions.opml', `<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head><title>${ex(CONFIG.APP_NAME)}</title></head>\n  <body>\n${body}\n  </body>\n</opml>\n`, 'text/x-opml');
}

async function authAction(kind) {

/* =========================================================
   تغيير عرض الأعمدة بالسحب (يُحفظ لكل جهاز)
   ========================================================= */
const COL_LIM = { side: [180, 480], list: [280, 900] };
const COLW = lsGet('s24r_cols', {});
function applyCols() {
  const m = $('#main');
  ['side', 'list'].forEach(k => COLW[k] ? m.style.setProperty('--w-' + k, COLW[k] + 'px') : m.style.removeProperty('--w-' + k));
}
applyCols();
document.querySelectorAll('.col-rs').forEach(h => {
  const k = h.id === 'rs-side' ? 'side' : 'list';
  h.addEventListener('pointerdown', e => {
    if (e.button !== 0) return; e.preventDefault();
    const m = $('#main'), x0 = e.clientX;
    const w0 = parseFloat(getComputedStyle(m).getPropertyValue('--w-' + k)) || (k === 'side' ? 260 : 400);
    h.setPointerCapture(e.pointerId); h.classList.add('on'); document.body.classList.add('col-resizing');
    const move = ev => {
      // الواجهة من اليمين لليسار: السحب نحو اليسار يوسّع العمود
      let w = w0 + (x0 - ev.clientX);
      let [mn, mx] = COL_LIM[k];
      if (k === 'list') mx = Math.min(mx, m.clientWidth - (COLW.side || 260) - 360); // يبقى لعمود القراءة 360px على الأقل
      else mx = Math.min(mx, m.clientWidth - 300);
      w = Math.round(Math.max(mn, Math.min(mx, w)));
      COLW[k] = w; m.style.setProperty('--w-' + k, w + 'px');
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      h.classList.remove('on'); document.body.classList.remove('col-resizing'); lsSet('s24r_cols', COLW);
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  h.addEventListener('dblclick', () => { delete COLW[k]; lsSet('s24r_cols', COLW); applyCols(); });
});

/* =========================================================
   سحب المصادر وإفلاتها: ترتيب يدوي ونقل بين المجلدات
   الحاسوب: اضغط واسحب — الجوال: اضغط مطوّلاً ثم اسحب
   ========================================================= */
let DRAG_CLICK_BLOCK = false;
document.addEventListener('click', e => { if (DRAG_CLICK_BLOCK) { DRAG_CLICK_BLOCK = false; e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener('touchmove', e => { if (DRAG && DRAG.on) e.preventDefault(); }, { passive: false });
$('#side').addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

$('#side').addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-drag="feed"]');
  if (!row || e.target.closest('.more') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if (e.pointerType === 'mouse') e.preventDefault();
  DRAG = { id: row.dataset.id, row, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, on: false, touch: e.pointerType !== 'mouse', pid: e.pointerId };
  if (DRAG.touch) DRAG.timer = setTimeout(() => DRAG && startFeedDrag(), 380);
  document.addEventListener('pointermove', onFeedDragMove);
  document.addEventListener('pointerup', endFeedDrag);
  document.addEventListener('pointercancel', cancelFeedDrag);
});

function startFeedDrag() {
  const d = DRAG; d.on = true;
  if (navigator.vibrate && d.touch) navigator.vibrate(15);
  const r = d.row.getBoundingClientRect();
  d.dx = d.x - r.left; d.dy = d.y - r.top;
  d.ghost = d.row.cloneNode(true); d.ghost.classList.remove('act', 'drop-in'); d.ghost.classList.add('drag-ghost');
  d.ghost.style.width = r.width + 'px'; document.body.appendChild(d.ghost);
  d.line = document.createElement('div'); d.line.className = 'drop-line hidden'; document.body.appendChild(d.line);
  d.row.classList.add('dragging-src'); document.body.classList.add('feed-dragging');
  placeGhost(); trackDrop();
  const loop = () => { if (!DRAG || !DRAG.on) return; autoScrollSide(); DRAG.raf = requestAnimationFrame(loop); }; loop();
}
function onFeedDragMove(e) {
  const d = DRAG; if (!d || e.pointerId !== d.pid) return;
  d.x = e.clientX; d.y = e.clientY;
  if (!d.on) {
    const far = Math.hypot(d.x - d.x0, d.y - d.y0) > (d.touch ? 10 : 5);
    if (d.touch) { if (far) cancelFeedDrag(); return; }  // حركة قبل انتهاء الضغط المطوّل = تمرير عادي
    if (!far) return; startFeedDrag();
  }
  placeGhost(); trackDrop();
}
function placeGhost() { const d = DRAG; d.ghost.style.left = (d.x - d.dx) + 'px'; d.ghost.style.top = (d.y - d.dy) + 'px'; }
function autoScrollSide() {
  const sd = $('#side'), r = sd.getBoundingClientRect(), y = DRAG.y, edge = 48;
  if (y < r.top + edge) sd.scrollTop -= Math.ceil((r.top + edge - y) / 4);
  else if (y > r.bottom - edge) sd.scrollTop += Math.ceil((y - (r.bottom - edge)) / 4);
  else return;
  trackDrop();
}
function trackDrop() {
  const d = DRAG; let tgt = null;
  $$('#side .drop-in').forEach(n => n.classList.remove('drop-in'));
  const el = document.elementFromPoint(d.x, d.y);
  const row = el && el.closest('#side .nav-i[data-view="feed"], #side .nav-i[data-view="folder"], #side h4[data-drop="root"]');
  if (row && row.matches('[data-view="folder"]')) {
    const fid = row.dataset.id; row.classList.add('drop-in'); tgt = { folder: fid, before: null, end: true };
    // مجلد مطوي: يُفتح بعد ثلثي ثانية من الوقوف فوقه
    if (collapsed.has(fid)) { if (d.hoverFid !== fid) { clearTimeout(d.openT); d.hoverFid = fid; d.openT = setTimeout(() => { if (DRAG && DRAG.on && DRAG.hoverFid === fid) { collapsed.delete(fid); lsSet('s24r_collapsed', [...collapsed]); renderSide(true); trackDrop(); } }, 650); } }
    else { clearTimeout(d.openT); d.hoverFid = null; }
  } else {
    clearTimeout(d.openT); d.hoverFid = null;
    if (row && row.matches('h4')) { tgt = { folder: '', before: (feedsInFolder('').find(([i]) => i !== d.id) || [])[0] || null }; const fr = row.getBoundingClientRect(); showLine(fr, fr.bottom); }
    else if (row) {
      const r = row.getBoundingClientRect(), f = S.feeds[row.dataset.id];
      if (f) {
        const after = d.y > r.top + r.height / 2, fid = f.folder || '';
        const list = feedsInFolder(fid).map(([i]) => i).filter(i => i !== d.id);
        let idx = list.indexOf(row.dataset.id); if (idx < 0) idx = list.length; else if (after) idx++;
        tgt = { folder: fid, before: list[idx] || null };
        showLine(r, after ? r.bottom : r.top);
      }
    }
  }
  if (!tgt || tgt.end) d.line.classList.add('hidden');
  d.tgt = tgt;
}
function showLine(r, y) { const l = DRAG.line; l.classList.remove('hidden'); l.style.left = r.left + 'px'; l.style.width = r.width + 'px'; l.style.top = (y - 1) + 'px'; }
function cleanupFeedDrag() {
  const d = DRAG; if (!d) return;
  clearTimeout(d.timer); clearTimeout(d.openT); cancelAnimationFrame(d.raf);
  document.removeEventListener('pointermove', onFeedDragMove);
  document.removeEventListener('pointerup', endFeedDrag);
  document.removeEventListener('pointercancel', cancelFeedDrag);
  if (d.ghost) d.ghost.remove(); if (d.line) d.line.remove();
  document.body.classList.remove('feed-dragging');
  const redraw = d.on || d.pending; DRAG = null;
  if (redraw) renderSide();   // لا نعيد الرسم بعد نقرة عادية حتى لا يضيع حدث النقر
}
function cancelFeedDrag() { if (DRAG && DRAG.on) { DRAG_CLICK_BLOCK = true; setTimeout(() => DRAG_CLICK_BLOCK = false, 0); } cleanupFeedDrag(); }
function endFeedDrag(e) {
  const d = DRAG; if (!d || e.pointerId !== d.pid) return;
  if (!d.on) { cleanupFeedDrag(); return; }   // لم يحدث سحب: نقرة عادية تفتح المصدر
  DRAG_CLICK_BLOCK = true; setTimeout(() => DRAG_CLICK_BLOCK = false, 0);
  const t = d.tgt, id = d.id; cleanupFeedDrag();
  if (!t || !S.feeds[id]) return;
  const list = feedsInFolder(t.folder).map(([i]) => i).filter(i => i !== id);
  const at = t.before ? list.indexOf(t.before) : -1;
  list.splice(at < 0 ? list.length : at, 0, id);
  const upd = {};
  list.forEach((fid, i) => { if (S.feeds[fid].order !== (i + 1) * 10) upd[`feeds/${fid}/order`] = (i + 1) * 10; });
  const moved = (S.feeds[id].folder || '') !== t.folder;
  if (moved) upd[`feeds/${id}/folder`] = t.folder;
  if (!Object.keys(upd).length) return;
  Store.update(upd);
  if (moved) toast(t.folder ? `نُقل إلى «${(S.folders[t.folder] || {}).name || 'مجلد'}»` : 'نُقل خارج المجلدات');
  renderAll();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-view],[data-item],[data-draft]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act) {
    e.preventDefault(); e.stopPropagation();
    const it = SEL && getItem(SEL);
    switch (act) {
      case 'toggle-side': $('#side').classList.toggle('open'); break;
      case 'refresh': refreshAll(); break;
      case 'refresh-one': refreshFeed(id); break;
      case 'add-feed': openAddFeed(); break;
      case 'quick-add': quickAdd(t.dataset.url, t.dataset.title); break;
      case 'af-check': checkFeedUrl(); break;
      case 'af-save': saveNewFeed(); break;
      case 'settings': openSettings(); break;
      case 'theme': Store.write('settings/theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); break;
      case 'se-save': saveSettings(); break;
      case 'close-modal': closeModal(); break;
      case 'new-folder': newFolder(); break;
      case 'fo-save': saveFolder(); break;
      case 'feed-menu': feedMenu(t, id); break;
      case 'folder-menu': folderMenu(t, id); break;
      case 'toggle-folder': collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); lsSet('s24r_collapsed', [...collapsed]); renderSide(); break;
      case 'ef-save': {
        const fid = $('#ov').dataset.id; const url = $('#ef-url').value.trim();
        Store.update({ [`feeds/${fid}/title`]: $('#ef-name').value.trim() || S.feeds[fid].title, [`feeds/${fid}/url`]: url || S.feeds[fid].url, [`feeds/${fid}/folder`]: $('#ef-folder').value });
        closeModal(); renderAll(); if (url) refreshFeed(fid); break;
      }
      case 'lf': Store.write('settings/listFilter', t.dataset.v); renderList(); break;
      case 'view-mode': Store.write('settings/view', t.dataset.v); renderAll(); break;
      case 'mark-all': markAllRead(); break;
      case 'star': if (it) toggleFlag(it.id, 's'); break;
      case 'later': if (it) toggleFlag(it.id, 'l'); break;
      case 'toggle-read': if (it) toggleFlag(it.id, 'r'); break;
      case 'to-draft': if (it) itemToDraft(it); break;
      case 'copy-link': if (it) { navigator.clipboard.writeText(it.link).then(() => toast('نُسخ الرابط')); } break;
      case 'fulltext': if (it) loadFullText(it.id); break;
      case 'close-reader': SEL = null; $('#main').classList.remove('reading'); renderList(); renderReader(); break;
      case 'new-draft': { const did = uid(); Store.write('drafts/' + did, { title: '', body: '', createdAt: Date.now(), updatedAt: Date.now() }); setView({ type: 'drafts' }, did); setTimeout(() => $('#d-title') && $('#d-title').focus(), 50); break; }
      case 'draft-copy': { const d = S.drafts[SEL]; if (d) navigator.clipboard.writeText(d.title + '\n\n' + d.body).then(() => toast('نُسخ النص')); break; }
      case 'draft-copy-html': { const d = S.drafts[SEL]; if (d) navigator.clipboard.writeText(draftHtml(d)).then(() => toast('نُسخ HTML')); break; }
      case 'draft-del': if (confirm('حذف المسودة؟')) { Store.write('drafts/' + SEL, null); setView({ type: 'drafts' }); } break;
      case 'rules': openRules(); break;
      case 'rule-new': editRule(null); break;
      case 'rule-edit': editRule(id); break;
      case 'rule-save': saveRule(); break;
      case 'rule-del': if (confirm('حذف القاعدة؟')) { const rid = $('#ov').dataset.id; Store.write('rules/' + rid, null); if (VIEW.type === 'rule' && VIEW.id === rid) { closeModal(); setView({ type: 'all' }); } else { openRules(); scheduleRender(); } } break;
      case 'opml-import': $('#opml-file').click(); break;
      case 'opml-export': exportOpml(); break;
      case 'json-export': download('s24nreader-backup.json', JSON.stringify({ ...S, states: undefined }, null, 2), 'application/json'); break;
      case 'clear-cache': if (confirm('مسح المقالات المخزّنة مؤقتاً؟ (لن تُحذف مصادرك أو المحفوظات)')) { IDB.clear(); ITEMS.clear(); closeModal(); renderAll(); refreshAll(); } break;
      case 'logout': if (confirm('تسجيل الخروج من حسابك؟')) { await firebase.auth().signOut(); location.reload(); } break;
      case 'google': authAction('google'); break;
      case 'au-in': authAction('in'); break;  // احتياطي، الإرسال يتم عبر النموذج
      case 'au-up': authAction('up'); break;

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) { if (e.key === 'Escape') { e.target.blur(); closeModal(); } return; }
  if ($('#ov')) { if (e.key === 'Escape') closeModal(); return; }
  const it = SEL && VIEW.type !== 'drafts' && getItem(SEL);
  switch (e.key) {
    case 'j': case 'ArrowDown': if (VIEW.type !== 'drafts') { e.preventDefault(); moveSel(1); } break;
    case 'k': case 'ArrowUp': if (VIEW.type !== 'drafts') { e.preventDefault(); moveSel(-1); } break;
    case 's': if (it) toggleFlag(it.id, 's'); break;
    case 'l': if (it) toggleFlag(it.id, 'l'); break;
    case 'm': if (it) toggleFlag(it.id, 'r'); break;
    case 'v': if (it) window.open(it.link, '_blank', 'noopener'); break;
    case 'd': if (it) itemToDraft(it); break;
    case 'r': refreshAll(); break;
    case 'z': if (UNDO) UNDO(); break;
    case '/': e.preventDefault(); $('#q').focus(); break;
    case 'Escape': if (SEL) { SEL = null; $('#main').classList.remove('reading'); renderList(); renderReader(); } break;
  }

}
