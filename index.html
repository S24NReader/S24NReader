<style>
/* =========================================================
   S24NReader v1.0 — قارئ خلاصات عربي (ملف واحد)
   ========================================================= */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --side:#f0f2ef; --line:#e3e6e1; --line2:#eef0ec;
  --tx:#1b1f1c; --tx2:#5b635d; --tx3:#8a918b;
  --ac:#0f7b4b; --ac2:#e3f2ea; --ac3:#0a5c38;
  --star:#d99a00; --later:#2f6fd6; --danger:#c2362b;
  --sel:#e8f3ec; --hover:#f3f5f2; --unread:#0f7b4b;
  --shadow:0 10px 30px rgba(20,30,25,.12), 0 2px 6px rgba(20,30,25,.06);
  --r:10px; --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
[data-theme="dark"]{
  --bg:#121513; --panel:#181c19; --side:#141815; --line:#262b27; --line2:#1f2420;
  --tx:#e7ebe8; --tx2:#a5ada7; --tx3:#727a74;
  --ac:#3cc38a; --ac2:#173426; --ac3:#62d6a3;
  --sel:#1b2b22; --hover:#1d221e; --unread:#3cc38a;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--ac)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* ---------- الهيكل ---------- */
#app{display:grid;grid-template-columns:62px minmax(0,1fr);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap;min-width:200px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#0f7b4b;-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.5px}
.brand b{color:var(--ac)}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 38px 0 12px;outline:none}
.search input:focus{border-color:var(--ac);background:var(--panel)}
.search .ico{position:absolute;right:11px;top:10px;color:var(--tx3)}
.top-acts{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.ibtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--tx2)}
.ibtn:hover{background:var(--hover);color:var(--tx)}
.ibtn.on{color:var(--ac)}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac3)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

.main{--w-side:260px;--w-list:400px;display:grid;grid-template-columns:var(--w-side) var(--w-list) minmax(0,1fr);min-height:0;position:relative}
.main.wide-list{grid-template-columns:var(--w-side) 1fr 0}
/* مقابض تغيير عرض الأعمدة */
.col-rs{position:absolute;top:0;bottom:0;width:9px;margin-right:-5px;z-index:6;cursor:col-resize;touch-action:none}
.col-rs::after{content:'';position:absolute;top:0;bottom:0;right:3px;width:3px;background:var(--ac);opacity:0;transition:opacity .12s}
.col-rs:hover::after,.col-rs.on::after{opacity:1}
#rs-side{right:var(--w-side)}
#rs-list{right:calc(var(--w-side) + var(--w-list))}
.main.wide-list #rs-list,.main.cards-mode #rs-list{display:none}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing iframe,body.col-resizing .reader{pointer-events:none}
/* سحب المصادر */
.nav-i.drag-ghost{position:fixed;margin:0;z-index:1000;pointer-events:none;opacity:.85;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);direction:rtl}
.drop-line{position:fixed;z-index:999;height:2px;background:var(--ac);pointer-events:none;border-radius:2px}
.drop-line::before{content:'';position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.nav-i.drop-in{outline:2px solid var(--ac);outline-offset:-2px;background:var(--ac2)}
.nav-i.dragging-src,.folder.dragging-src{opacity:.35}
body.feed-dragging{cursor:grabbing;user-select:none}
body.feed-dragging .nav-i:hover{background:none}
/* ---------- الشريط الجانبي ---------- */
.side{background:var(--side);border-left:1px solid var(--line);overflow:auto;padding:10px 8px 40px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--tx2);cursor:pointer;user-select:none;position:relative}
.nav-i:hover{background:var(--hover);color:var(--tx)}
.nav-i.act{background:var(--sel);color:var(--tx);font-weight:600}
.nav-i .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .cnt{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.nav-i.has-unread .cnt{color:var(--ac);font-weight:600}
.nav-i .more{opacity:0;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--tx3)}
.nav-i:hover .more{opacity:1}
.nav-i .more:hover{background:var(--line)}
.nav-i img.fav{width:16px;height:16px;border-radius:3px;flex:none}
.nav-i .fico{display:grid}
.nav-i .sw{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}
.nav-i.off{opacity:.5}
.nav-i.paused .lbl,.nav-i.paused .fav{opacity:.45}
.nav-i .pz{width:14px;height:14px;flex:none;color:var(--tx3)}
.lh-pz{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.lh-pz .ico{width:14px;height:14px}
.lh-pz .lnk{color:var(--ac);font-weight:600}
.nav-i .err{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--tx3);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.side h4 span{display:flex;gap:2px}
.side h4 button{color:var(--tx3);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.side h4 button:hover{background:var(--line);color:var(--tx)}
.folder>.nav-i .chev{transition:transform .15s;width:14px;height:14px}
.folder.collapsed>.nav-i .chev{transform:rotate(90deg)}
.folder.collapsed>.kids{display:none}
.kids{padding-inline-start:14px}
.side-foot{margin-top:14px;padding:10px;font-size:12px;color:var(--tx3)}
.side-foot.acct{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.side-foot.acct .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}

/* ---------- قائمة المقالات ---------- */
.list{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-h{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:54px}
.list-h h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:3px 9px;border-radius:6px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.items{overflow:auto;flex:1}
.it{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.it:hover{background:var(--hover)}
.it.sel{background:var(--sel)}
.it.hl::before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--hl,var(--star))}
.it-main{flex:1;min-width:0}
.it-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);margin-bottom:2px}
.it-meta img{width:14px;height:14px;border-radius:3px}
.it-meta .src{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-title{font-size:15px;line-height:1.5;color:var(--tx2);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.unread .it-title{color:var(--tx);font-weight:700}
.it.unread .dot{width:7px;height:7px;border-radius:50%;background:var(--unread);flex:none}
.it-snip{font-size:13px;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.it-th{width:84px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--line2)}
.it-flags{display:flex;gap:4px;align-items:center}
.it-flags .ico{width:14px;height:14px}
.it-flags .f-pin{color:var(--ac)}
.offline{position:fixed;bottom:16px;left:12px;right:12px;margin:0 auto;width:fit-content;z-index:60;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:#5b4a12;color:#fff;font-size:13px;box-shadow:var(--shadow)}
.offline .ico{width:16px;height:16px;flex:none}
.offline.hidden{display:none}
.ru-more{margin-bottom:14px}
.ru-more summary{cursor:pointer}
.ru-more .hint{font-size:12.5px;color:var(--tx3);line-height:1.6}
.dup-b{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 8px;border-radius:7px;font-size:12px;color:var(--tx3);background:var(--line2);max-width:100%}
.dup-b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dup-b b{color:var(--tx2)}
.dup-b:hover{color:var(--tx);background:var(--hover)}
.dup-b .ico{width:13px;height:13px;flex:none}
.dup-b.open .dn{transform:rotate(90deg)}
.dupc{display:inline-flex;align-items:center;gap:2px;padding:0 5px;border-radius:6px;background:var(--line2);color:var(--tx2);font-size:11px;font-weight:600}
.dupc .ico{width:12px;height:12px}
.dup-list{margin-top:6px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.dup-r{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:7px 10px;font-size:12px;color:var(--tx3);cursor:pointer;border-top:1px solid var(--line2)}
.dup-r:first-child{border-top:0}
.dup-r:hover{background:var(--hover)}
.dup-r img{width:14px;height:14px;border-radius:3px}
.dup-r .src{color:var(--tx2);font-weight:600}
.dup-r .t{flex-basis:100%;font-size:13px;line-height:1.5;color:var(--tx2)}
.dup-r.unread .t{color:var(--tx);font-weight:600}
.dup-r.cur{background:var(--sel)}
.dup-r .first,.dup-r .now{padding:0 6px;border-radius:6px;font-size:11px;background:var(--line2);color:var(--tx2)}
.dup-r .first{background:var(--ac);color:#fff}
.art-dups{margin:10px 0 4px;font-size:13px}
.art-dups summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;color:var(--tx2);padding:6px 10px;border-radius:9px;background:var(--line2);width:fit-content;max-width:100%}
.art-dups summary::-webkit-details-marker{display:none}
.art-dups summary span{color:var(--tx3)}
.art-dups summary .ico{width:14px;height:14px;flex:none}
.art-dups[open] summary .dn{transform:rotate(90deg)}
.f-star{color:var(--star)} .f-later{color:var(--later)}
.chip{font-size:11px;padding:0 7px;border-radius:20px;background:var(--ac2);color:var(--ac3);white-space:nowrap}
.items.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:auto;gap:14px;padding:14px;align-content:start;align-items:start}
/* البطاقة كتلة عادية (بلا flex) حتى يحسب المتصفح ارتفاعها بدقة فلا تتداخل البطاقات ولا تُقصّ العناوين */
.items.cards .it{display:block;border:1px solid var(--line);border-radius:12px;padding:0}
.items.cards .it-main{padding:12px 14px 14px}
.items.cards .it-title{line-height:1.7;-webkit-line-clamp:3}
.items.cards .it-th{display:block;width:100%;height:140px;border-radius:11px 11px 0 0}
.items.cards .it.hl::before{width:100%;height:3px;bottom:auto}
.empty{padding:50px 24px;text-align:center;color:var(--tx3)}
.empty h3{color:var(--tx);margin:10px 0 6px;font-size:17px}
.empty .ico{width:44px;height:44px;stroke-width:1.3;color:var(--tx3)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}

/* ---------- القارئ ---------- */
.reader{background:var(--panel);overflow:auto;min-width:0}
.r-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:2px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.r-bar .sp{flex:1}
.r-back{display:none}
.art{max-width:760px;margin:0 auto;padding:26px 28px 80px}
.art-src{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:13px}
.art-src img{width:18px;height:18px;border-radius:4px}
.art-src-l{display:inline-flex;align-items:center;gap:3px;color:var(--ac);font:inherit;font-weight:600;padding:2px 0}
.art-src-l .ico{width:14px;height:14px}
.art-src-l:hover span{text-decoration:underline}
.art-fol{font-weight:600}
.art h1{font-size:27px;line-height:1.45;margin:10px 0 8px}
.art h1 a{color:var(--tx);text-decoration:none}
.art h1 a:hover{color:var(--ac)}
.art-meta{color:var(--tx3);font-size:13px;margin-bottom:20px}
.art-body{font-family:var(--rf,inherit);font-size:var(--rs,17.5px);line-height:var(--rl,1.95)}
.art-body img,.art-body video{max-width:100%;height:auto;border-radius:8px}
.art-body figure{margin:16px 0}
.art-body figcaption{font-size:13px;color:var(--tx3)}
.art-body blockquote{margin:16px 0;padding:6px 16px;border-right:3px solid var(--ac);background:var(--bg);border-radius:6px}
.art-body pre{overflow:auto;background:var(--bg);padding:12px;border-radius:8px;direction:ltr;text-align:left}
.art-lead{width:100%;border-radius:10px;margin-bottom:18px;max-height:440px;object-fit:cover}
.art-note{margin-top:28px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--tx3);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reader-empty{height:100%;display:grid;place-items:center;color:var(--tx3);text-align:center;padding:30px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;margin:0 2px;font-family:ui-monospace,monospace}

/* محرر المسودات */
.ed{max-width:820px;margin:0 auto;padding:22px 26px 60px}
.ed input.t{width:100%;font-size:24px;font-weight:700;border:0;outline:none;background:none;padding:6px 0;border-bottom:1px solid var(--line)}
.ed textarea{width:100%;min-height:55vh;border:0;outline:none;background:none;resize:vertical;font-size:17px;line-height:1.9;padding:14px 0}
.ed-src{font-size:13px;color:var(--tx3);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:12px}
.ed-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--tx3);font-size:13px}

/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;z-index:50;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.mdl{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.mdl.lg{width:min(760px,100%)}
.mdl-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mdl-h h3{margin:0;font-size:17px;flex:1}
.mdl-b{padding:16px 18px;overflow:auto}
.mdl-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.fld .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.in{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 12px;outline:none}
textarea.in{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--ac);background:var(--panel)}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1}
.ltr{direction:ltr;text-align:left}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.box h5{margin:0 0 6px;font-size:14px}
.pv li{font-size:13.5px;color:var(--tx2);margin-bottom:3px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt input{margin-top:5px}
.opt small{display:block;color:var(--tx3);word-break:break-all}
.msg{padding:10px 12px;border-radius:9px;font-size:13.5px;margin-top:10px}
.msg.err{background:#fbe9e7;color:#8f2a20}
[data-theme="dark"] .msg.err{background:#3a1d1a;color:#f2b8b0}
.msg.ok{background:var(--ac2);color:var(--ac3)}
.rule{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rule .sw{width:12px;height:12px;border-radius:50%;flex:none}
.rule .rb{flex:1;min-width:0}
.rule .rb small{display:block;color:var(--tx3)}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.15s}
.toggle input:checked+span{background:var(--ac)}
.toggle input:checked+span::after{right:19px}
/* منتقي الألوان: ألوان جاهزة + لون مخصّص غير محدود */
.cpick{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cpick .sw-c{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);position:relative;padding:0;margin:0}
.cpick .sw-c.on{box-shadow:0 0 0 2px var(--tx)}
.cpick .custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.cpick .custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.cpick .cval{font-size:12px;color:var(--tx3);font-family:ui-monospace,monospace;direction:ltr;margin-inline-start:4px}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:60;min-width:190px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;text-align:right}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast.undo{display:flex;align-items:center;gap:16px;padding:8px 10px 8px 18px}
.toast.undo button{color:#7ee2b0;font-weight:700;padding:4px 10px;border-radius:7px}
.toast.undo button:hover{background:rgba(255,255,255,.1)}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none}
#toasts>*{pointer-events:auto}
.toast{background:#1b1f1c;color:#fff;padding:10px 18px;border-radius:10px;z-index:70;font-size:14px;box-shadow:var(--shadow);animation:fade .15s}
.banner{background:#fff7e0;color:#6b5000;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0e2b0}
[data-theme="dark"] .banner{background:#2d2610;color:#e9d38c;border-color:#463b17}

/* ---------- الدخول ---------- */
.auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:20px}
.auth-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.auth-card .brand{justify-content:center;font-size:21px;margin-bottom:4px}
.auth-card p.sub{text-align:center;color:var(--tx3);margin:0 0 22px}
.or{display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-card .btn{width:100%;justify-content:center;height:42px}
.lnk{color:var(--ac);font-size:13px;cursor:pointer}

/* ---------- الجوال ---------- */
/* وضع البطاقات: الشبكة تأخذ العرض كله، والمقالة تُفتح مكانها مع زر رجوع */
.main.cards-mode{grid-template-columns:var(--w-side) 1fr}
/* pop: المقالة تُفتح في نافذة منبثقة (وضع البطاقات ولوحة البداية) */
.main.pop .reader{display:none}
.seg .ico{width:15px;height:15px;display:block}
@media (max-width:1100px){ .main{grid-template-columns:var(--w-side) 1fr} #rs-list{display:none} .main .reader{display:none} .main.reading .list{display:none} .main.reading .reader{display:block} .r-back{display:grid} }
@media (max-width:760px){
  .brand{min-width:0} .brand span{display:none}
  .main{grid-template-columns:1fr} .col-rs{display:none}
  .side{position:fixed;top:56px;bottom:0;right:0;width:82%;max-width:300px;z-index:30;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .art{padding:18px 16px 70px} .art h1{font-size:22px} .art-body{font-size:16.5px}
  .it-th{width:70px;height:56px}
  .r-bar{flex-wrap:nowrap;padding:6px 8px;overflow-x:auto}
  .r-bar .btn .t{display:none}
  .hide-m{display:none!important}
}
@media (min-width:761px){ .only-m{display:none!important} }
/* ---------- وحدة المقالة ---------- */
.r-x,.r-nav{display:none}
.r-bar .ibtn.on{color:var(--ac)}
.r-share{display:inline-flex;gap:0}
.r-share .ibtn{color:var(--tx3)} .r-share .ibtn:hover{color:var(--tx)}
/* دائرة التقدّم: كلها مرسومة داخل SVG بإحداثيات ثابتة، فلا يتأثر موضع الرقم بالخط أو الجهاز */
.r-prog{position:relative;flex:none;width:30px;height:30px;margin:0 4px;color:var(--tx3)}
.r-prog svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r-prog .bg{fill:none;stroke:var(--line);stroke-width:3}
.r-prog .v{fill:none;stroke:var(--ac);stroke-width:3;stroke-dasharray:94.25;transition:stroke-dashoffset .2s}
.r-prog text{fill:currentColor;font-size:11.5px;font-weight:600;font-family:inherit}
.r-prog .ck{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.r-prog .dt{fill:currentColor}
.r-prog.none{cursor:pointer}
.r-prog.none .bg{stroke-dasharray:3.2 2.6}
.art-tags{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 16px}
.tagchip{display:inline-flex;align-items:center;gap:4px;background:var(--ac2);color:var(--ac3);border-radius:20px;padding:2px 6px 2px 10px;font-size:13px;cursor:pointer}
.tagchip .ico{width:13px;height:13px}
.tagchip button{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;color:inherit;opacity:.6}
.tagchip button:hover{opacity:1;background:rgba(0,0,0,.08)}
.art-note2{border:1px solid var(--line);border-right:3px solid var(--later,#d9a400);border-radius:8px;padding:10px 14px;margin:0 0 16px;background:var(--bg)}
.art-note2 .nh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx3);margin-bottom:4px}
.art-note2 .nh b{color:var(--tx)} .art-note2 .sp{flex:1}
.art-note2 .nt{white-space:pre-wrap;font-size:15px;line-height:1.8}
.sum-row{margin:0 0 14px}
.sum-btn{border-color:var(--ac);color:var(--ac)}
.sum-btn.busy .ico{animation:spin 1.2s linear infinite}
.sum-box{border:1px solid var(--ac);background:var(--ac2);border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15.5px;line-height:1.85}
.sum-box .sh{display:flex;align-items:center;gap:7px;color:var(--ac3);font-size:13px;margin-bottom:4px}
.sum-box .sh span{color:var(--tx3);font-size:12px;margin-inline-start:auto}
.sum-box ul{margin:4px 0 0;padding-inline-start:20px} .sum-box p{margin:4px 0}
.tagpop{position:fixed;z-index:60;width:300px;max-height:420px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px}
.tagpop .tp-h{font-weight:600;margin:2px 4px 8px}
.tagpop .tp-l{overflow:auto;margin-top:8px}
.tagpop .tp-i{display:flex;width:100%;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;text-align:right}
.tagpop .tp-i:hover{background:var(--hover)}
.tagpop .tp-i.on{color:var(--ac);font-weight:600}
.tagpop .tp-i.new{color:var(--ac)}
.tagpop .tp-s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);margin:8px 6px 2px}
.tagpop .tp-s .ico{width:14px;height:14px}
.tagpop .tp-e{color:var(--tx3);font-size:13px;padding:8px}
.mt-r{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2,var(--line))}
.mt-k{color:var(--tx3);font-size:13px;font-weight:500}
.mt-v{font-size:14px;min-width:0}
.mt-v a{color:var(--ac);font-size:13px}
.note-by{display:flex;align-items:center;gap:8px;margin-bottom:10px}
/* النافذة المنبثقة في وضع البطاقات */
.main.pop.reading .list{display:flex}
.main.pop.reading .reader{display:block;position:fixed;inset:0;z-index:45;background:rgba(10,15,12,.55);overflow:auto;padding:22px 74px;animation:fade .12s}
.main.pop.reading .r-wrap{max-width:920px;margin:0 auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);min-height:100%}
.main.pop.reading .r-bar{border-radius:14px 14px 0 0;top:-22px}
.main.pop .r-back{display:none}
.main.pop.reading .r-x{display:grid;position:fixed;top:18px;left:18px;z-index:46;width:40px;height:40px;place-items:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.12)}
.main.pop.reading .r-nav{display:grid;position:fixed;top:50%;transform:translateY(-50%);z-index:46;width:48px;height:48px;place-items:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.12)}
.main.pop.reading .r-nav .ico,.main.pop.reading .r-x .ico{width:24px;height:24px}
.main.pop.reading .r-nav:hover,.main.pop.reading .r-x:hover{background:rgba(255,255,255,.25)}
.main.pop.reading .r-nav.prev{right:14px}
.main.pop.reading .r-nav.next{left:14px}
/* على طريقة Inoreader: خلفية أعتم، والأزرار بيضاء واضحة بجانب النافذة لا عند حافة الشاشة */
.main.pop.reading .reader{background:rgba(6,10,8,.72)}
.main.pop.reading .r-x,.main.pop.reading .r-nav{background:none;color:#fff;opacity:.9}
.main.pop.reading .r-x:hover,.main.pop.reading .r-nav:hover{opacity:1;background:rgba(255,255,255,.16)}
.main.pop.reading .r-nav{width:52px;height:52px}
.main.pop.reading .r-nav .ico{width:34px;height:34px;stroke-width:1.6}
.main.pop.reading .r-x{top:22px;width:44px;height:44px;left:max(12px,calc(50% - 460px - 60px))}
.main.pop.reading .r-x .ico{width:28px;height:28px}
.main.pop.reading .r-nav.prev{right:max(10px,calc(50% - 460px - 68px))}
.main.pop.reading .r-nav.next{left:max(10px,calc(50% - 460px - 68px))}
/* زر الأخبار الجديدة أعلى القائمة */
.new-wrap{position:relative;height:0;z-index:6}
.new-pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 14px 7px 16px;border-radius:999px;background:var(--ac);color:#fff;font:inherit;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;animation:fade .15s}
.new-pill:hover{filter:brightness(1.08)}
.new-pill .ico{width:16px;height:16px}
@media (max-width:760px){
  .main.pop.reading .reader{padding:0}
  .main.pop.reading .r-wrap{border-radius:0}
  .main.pop.reading .r-bar{border-radius:0;top:0}
  .main.pop.reading .r-nav,.main.pop.reading .r-x{display:none}
  .main.pop .r-back{display:grid}
  .tagpop{width:calc(100vw - 16px)}
  .mt-r{grid-template-columns:100px 1fr}
}
/* =========================================================
   المرحلة الأولى: شريط الأيقونات واللوحات ولوحة البداية (على طريقة Inoreader)
   ========================================================= */
:root{--rail:#e9ece8}
[data-theme="dark"]{--rail:#0f1210}
/* شريط الأيقونات */
.rail{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;background:var(--rail);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-height:0;z-index:20}
.rl{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);flex:none}
.rl:hover{background:var(--hover);color:var(--tx)}
.rl.on{background:var(--ac2);color:var(--ac)}
.rl .ico{width:22px;height:22px}
.rl .bdg{position:absolute;top:1px;left:-3px;min-width:18px;height:17px;padding:0 4px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:10px;line-height:15px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.rl.on .bdg{border-color:var(--ac);color:var(--ac)}
.rl-logo{margin-bottom:8px}
.rl-logo:hover{background:none}
.rl-logo .logo{width:38px;height:38px;border-radius:10px;display:block}
.rl-sp{flex:1;min-height:12px}
.rl-me .av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.rl-col.off .ico{transform:scaleX(-1)}
.content{display:flex;flex-direction:column;min-height:0;min-width:0}
/* اللوحة الجانبية */
.side h4.ph{position:sticky;top:-10px;z-index:3;margin:-10px -8px 8px;padding:12px 14px 8px;background:var(--side);font-size:16px;color:var(--tx);font-weight:700}
.side h4.ph button{width:28px;height:28px}
.p-alert{display:flex;width:100%;gap:8px;align-items:center;text-align:right;background:#fdecea;color:#8f2a20;border-radius:10px;padding:9px 12px;margin:0 0 10px;font-size:13px;font-weight:600}
.p-alert:hover{filter:brightness(.97)}
.p-alert .ico{color:var(--danger)}
[data-theme="dark"] .p-alert{background:#3a1d1a;color:#f2b8b0}
.main.nopanel{grid-template-columns:var(--w-list) minmax(0,1fr)}
.main.nopanel.cards-mode,.main.dash-mode{grid-template-columns:minmax(0,1fr)}
.main.nopanel #rs-list{right:var(--w-list)}
@media (min-width:761px){
  .main.nopanel .side{display:none}
  .main.nopanel #rs-side,.main.dash-mode #rs-list{display:none}
  .main.dash-mode:not(.nopanel){grid-template-columns:var(--w-side) minmax(0,1fr)}
}
/* رأس القائمة */
.list{container-type:inline-size}
.list-h{flex-wrap:wrap;gap:8px;padding:9px 12px}
#list-h{display:flex;align-items:center;gap:8px;flex:1 0 auto;max-width:100%;min-width:0}
#list-h2{display:flex;align-items:center;gap:4px}
.lh-s{flex:1 1 170px;max-width:320px}
.lh-s input{height:34px;padding:0 34px 0 10px}
.lh-s .ico{top:8px;right:10px}
.ma-g{display:inline-flex;flex:none}
.ma-g .ma{border-radius:0 9px 9px 0}
.ma-g .ma-dd{border-radius:9px 0 0 9px;border-right:0;padding:0 6px}
.ico.dn{transform:rotate(-90deg)}
.seg button{white-space:nowrap}
.seg button b{font-weight:600;color:var(--ac);margin-inline-start:3px;font-variant-numeric:tabular-nums}
@container (max-width:640px){ .ma .t{display:none} }
/* أدوات المقالة في القائمة والبطاقات */
.it-acts{display:flex;align-items:center;gap:2px}
.it-acts .sp{flex:1}
.it-time{font-size:12px;color:var(--tx3);padding-inline-start:4px}
.ia{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx3)}
.ia:hover{background:var(--line2);color:var(--tx)}
.ia.on{color:var(--later)}
.ia .ico{width:17px;height:17px}
.items:not(.cards) .it-acts{position:absolute;left:8px;top:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:1px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none;z-index:1}
.items:not(.cards) .it:hover .it-acts{display:flex}
.items:not(.cards) .it-acts .it-time,.items:not(.cards) .it-acts .sp{display:none}
@media (hover:none){ .items:not(.cards) .it-acts{display:none!important} }
.items.cards .it-main{display:flex;flex-direction:column}
.items.cards .it-title{order:1}
.items.cards .it-meta{order:2;margin:6px 0 0}
.items.cards .it-meta .tm{display:none}
.items.cards .it-acts{padding:0 8px 8px 10px;margin-top:-4px}
/* لوحة البداية */
.dash{display:none;overflow:auto;min-width:0;background:var(--bg)}
.main.dash-mode .dash{display:block}
.main.dash-mode .list{display:none!important}
.dash-in{max-width:1500px;margin:0 auto;padding:22px 26px 60px}
.dash-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dash-h h1{margin:0;font-size:24px;line-height:1.4}
.dash-d{color:var(--tx3);font-size:13px}
.dash-h .sp{flex:1}
.dash-st{display:flex;gap:8px;flex-wrap:wrap}
.dash-st button{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;color:var(--tx2)}
.dash-st button b{font-size:17px;color:var(--tx);font-variant-numeric:tabular-nums}
.dash-st button:hover{border-color:var(--ac)}
.dash-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.dw{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.dw.wide{grid-column:span 2}
@media (max-width:900px){ .dw.wide{grid-column:auto} }
.dw-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.dw-h>.ico{color:var(--ac)}
.dw-h h3{margin:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:60%}
.dw-c{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 100 auto}
.dw-h .sp{flex:1}
.dw-h .lnk{white-space:nowrap}
.dw-h .ibtn{width:30px;height:30px;flex:none}
.dw-b{padding:0 6px 8px}
.dw-i{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.dw-i:hover{background:var(--hover)}
.dw-th{width:72px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:var(--line2)}
.dw.wide .dw-th{width:116px;height:78px}
.dw-m{flex:1;min-width:0}
.dw-t{font-size:14px;line-height:1.55;color:var(--tx2);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dw-i.unread .dw-t{color:var(--tx);font-weight:700}
.dw-s{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden}
.dw-s img{width:13px;height:13px;border-radius:3px;flex:none}
.dw-s .src{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dw-x{font-size:13px;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.dw-pg{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.dw-pg i{flex:1;height:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.dw-pg i b{position:absolute;top:0;bottom:0;right:0;background:var(--ac);border-radius:4px}
.dw-e{padding:14px 12px 18px;color:var(--tx3);font-size:13.5px;text-align:center}
.dw-f{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:14px}
.dw-f:hover{background:var(--hover)}
.dw-f img{width:16px;height:16px;border-radius:3px;flex:none}
.dw-f .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw-f .cnt{font-size:12px;color:var(--ac);font-weight:600;font-variant-numeric:tabular-nums}
.dw-f .bad{font-size:11px;color:var(--danger);background:#fbe9e7;border-radius:6px;padding:0 6px;white-space:nowrap}
[data-theme="dark"] .dw-f .bad{background:#3a1d1a}
.dw-foot{display:flex;align-items:center;gap:8px;padding:8px 10px 2px;font-size:12px;color:var(--tx3);border-top:1px solid var(--line2);margin-top:4px}
.dw-sw{width:11px;height:11px;border-radius:50%;flex:none}
.dw-off{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.dc-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.dc-row .rb{flex:1;min-width:0}
.dc-row .ibtn{width:32px;height:32px}
/* الجوال: الشريط يصبح شريطاً سفلياً */
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  .content{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .rail{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)!important;flex-direction:row;justify-content:space-around;padding:0 4px;border-left:0;border-top:1px solid var(--line);z-index:35;overflow:visible}
  .rail .rl-logo,.rail .rl-sp{display:none}
  .rl{width:46px;height:46px}
  .rl .bdg{top:0;left:0}
  .side{top:0!important;bottom:calc(58px + env(safe-area-inset-bottom))}
  .offline{bottom:calc(66px + env(safe-area-inset-bottom))}
  .main.cards-mode,.main.nopanel{grid-template-columns:minmax(0,1fr)}
  .dash-in{padding:16px 12px 40px}
  .dash-h h1{font-size:20px}
  .dash-g{grid-template-columns:minmax(0,1fr)}
  .lh-s{max-width:none}
}
@media (max-width:1100px){ .main.nopanel{grid-template-columns:minmax(0,1fr)} }
/* الجوال: شريط علوي لأدوات الصفحة (👁 · 🔍 · ⟳) ثم العنوان و ⋯ ولوحة الخيارات السفلية؛ التنقل بين الأقسام في الشريط السفلي */
.mhd{display:flex;align-items:center;gap:2px;padding:6px 8px 0;background:var(--panel)}
.mhd-sp{flex:1}
.mhd .ibtn{width:42px;height:42px;color:var(--tx)}
.mhd .ibtn .ico{width:22px;height:22px}
.mhd .ibtn.on{background:var(--ac2);color:var(--ac)}
.msheet{position:fixed;inset:0;z-index:55}
.ms-dim{position:absolute;inset:0;background:#0007}
.ms-b{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px #0003;max-height:85vh;overflow:auto}
.ms-grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.ms-h{font-size:13px;font-weight:700;color:var(--tx3);margin:12px 0 7px}
.ms-r{display:flex;gap:8px}
.ms-p{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px;color:var(--tx2)}
.ms-p .ico{width:17px;height:17px}
.ms-p.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ms-a{display:flex;width:100%;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line2);font-size:15px;color:var(--tx);text-align:right}
.ms-r+.ms-a{margin-top:14px}
.ms-a .ico{width:20px;height:20px;color:var(--tx2)}
@media (max-width:760px){
  .list-h{flex-wrap:nowrap;align-items:flex-end;padding:2px 16px 12px;min-height:0}
  #list-h{display:block;flex:1;min-width:0}
  #list-h h2{font-size:23px}
  #list-h .ma-g,#list-h .seg,#list-h2>:not(.lh-more),.lh-r{display:none!important}
  .lh-n{display:block;font-size:13px;color:var(--tx3);margin-top:2px}
  .main:not(.srch) .lh-s,.main:not(.srch) .lh-x{display:none}
  .content:has(.main.srch) .mhd,.content:has(.main.reading) .mhd,.main.srch #list-h,.main.srch #list-h2{display:none}
  .main.srch .list-h{align-items:center;padding:8px 8px 8px 4px}
  .main.srch .lh-s input{height:40px;font-size:16px}
  .main.srch .lh-s input::-webkit-search-cancel-button{display:none}
}
/* ---------- الرائج: الأكثر قراءة، الأكثر تداولاً، الأكثر قراءة في المواقع ---------- */
:root{--heat:#b85a08;--heat2:#fbeee2}
[data-theme="dark"]{--heat:#ffa94d;--heat2:#33261a}
.tr-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.tr-ttl{min-width:0}
.tr-ttl h1{margin:0;font-size:26px;line-height:1.3;display:flex;align-items:center;gap:9px}
.tr-ttl h1 .ico{width:26px;height:26px;color:var(--heat);stroke-width:2}
.tr-ttl p{margin:4px 0 0;color:var(--tx3);font-size:13.5px;max-width:64ch;line-height:1.7}
.tr-h .sp{flex:1}
.seg.tr-tabs{padding:3px;border-radius:11px}
.seg.tr-tabs button{height:34px;padding:0 14px;border-radius:8px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.seg.tr-tabs button .ico{width:16px;height:16px}
.seg.tr-tabs button.on .ico{color:var(--heat)}
.tr-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:34px}
.tr-tools .sp{flex:1}
.tr-tools .hint{font-size:12.5px;color:var(--tx3)}
.tr-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:30px;background:var(--ac2);color:var(--ac3);font-size:13px;font-weight:600;max-width:100%}
.tr-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-chip .ico{width:15px;height:15px}
.tr-chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.tr-chip button:hover{background:rgba(0,0,0,.08)}
/* الشبكة: الأول كبير بجانب بقية الترتيب */
.tr-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.tr-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;position:sticky;top:0}
.tr-hero:hover{border-color:var(--ac)}
.tr-hi{aspect-ratio:16/9;background:var(--line2);overflow:hidden}
.tr-hi img{width:100%;height:100%;object-fit:cover;display:block}
.tr-hb{display:flex;gap:14px;padding:16px 18px 18px}
.tr-hero h2{margin:0;font-size:21px;line-height:1.55;font-weight:700}
.tr-hero p{margin:8px 0 0;color:var(--tx2);font-size:14px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tr-hero .tr-s{margin-top:8px}
.tr-hv{display:flex;align-items:baseline;gap:6px;margin-top:12px;color:var(--tx3);font-size:13px}
.tr-hv b{font-size:22px;color:var(--tx);font-variant-numeric:tabular-nums}
.tr-hero .tr-n{font-size:44px;line-height:1;min-width:auto}
.tr-list{list-style:none;margin:0;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.tr-r{display:flex;align-items:center;gap:12px;padding:10px;border-radius:11px;cursor:pointer}
.tr-r+.tr-r{border-top:1px solid var(--line2)}
.tr-r:hover{background:var(--hover)}
.tr-n{flex:none;min-width:34px;text-align:center;font-size:28px;font-weight:700;line-height:1;color:var(--tx3);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tr-n.hot{color:var(--heat)}
.tr-m{flex:1;min-width:0}
.tr-t{font-size:14.5px;line-height:1.6;font-weight:600;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr-r:not(.unread) .tr-t{color:var(--tx2);font-weight:500}
.tr-s{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden}
.tr-s img{width:14px;height:14px;border-radius:3px;flex:none}
.tr-s .src{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr-favs{display:inline-flex;flex:none}
.tr-favs img{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);background:var(--panel);margin-inline-start:-6px}
.tr-favs img:first-child{margin-inline-start:0}
.tr-q{height:3px;border-radius:3px;background:var(--line2);margin-top:7px;overflow:hidden;max-width:260px}
.tr-q i{display:block;height:100%;background:var(--ac);border-radius:3px}
.tr-v{flex:none;display:flex;flex-direction:column;align-items:center;min-width:46px;line-height:1.15}
.tr-v b{font-size:17px;font-variant-numeric:tabular-nums}
.tr-v small{font-size:11px;color:var(--tx3)}
.tr-th{width:84px;height:60px;border-radius:9px;object-fit:cover;flex:none;background:var(--line2)}
/* مواقع «الأكثر قراءة» */
.tr-sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px;align-items:start}
.tr-site{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;padding-bottom:6px}
.tr-sh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.tr-sh img{width:20px;height:20px;border-radius:5px;flex:none}
.tr-sh h3{margin:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-sh .sp{flex:1}
.tr-sh .ibtn{width:30px;height:30px}
.tr-sh .bad{color:var(--danger)}
.tr-old{display:flex;gap:6px;align-items:flex-start;margin:0 14px 6px;padding:6px 10px;border-radius:10px;font-size:12px;line-height:1.7;color:var(--danger);background:#fbe9e7}
[data-theme="dark"] .tr-old{background:#3a1d1a}
.tr-old svg{width:14px;height:14px;flex:none;margin-top:3px}
.tr-upd{border-color:var(--ac)!important;color:var(--ac)!important;gap:6px}
.tr-upd::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}
.dw-h .tr-upd{font-size:12px;padding:0 8px;height:26px;flex:none}
.tr-sl{list-style:none;margin:0;padding:0 6px}
.tr-sl li{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.tr-sl li:hover{background:var(--hover)}
.tr-sl .tr-n{font-size:20px;min-width:24px;padding-top:2px}
.tr-sl .tr-t{font-size:14px;font-weight:500}
/* مربع لوحة البداية */
.dw .tr-list.mini{border:0;padding:0;background:none}
.dw .tr-list.mini .tr-r{padding:8px}
.dw .tr-list.mini .tr-n{font-size:22px;min-width:26px}
.dw .tr-list.mini .tr-t{font-size:14px}
.dw .tr-list.mini .tr-v b{font-size:15px}
.dw-tabs{display:flex;margin:0 8px 6px}.dw-tabs button{flex:1}
.dw .tr-list.mini .tr-th{display:none}
.dw[data-w="trend"] .dw-h>.ico{color:var(--heat)}
/* هيكل التحميل */
.tr-sk{border-radius:8px;background:linear-gradient(90deg,var(--line2),var(--hover),var(--line2));background-size:200% 100%;animation:trsk 1.2s ease-in-out infinite}
@keyframes trsk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.tr-sk{animation:none}}
/* شارة القراءات في القوائم */
.popn{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;margin-inline-start:4px}
.popn .ico{width:13px;height:13px}
/* إدارة المواقع */
.ms-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ms-row img{width:18px;height:18px;border-radius:4px;flex:none}
.ms-row .rb{flex:1;min-width:0}
.ms-row code,.ms-cand code{font-size:12px;direction:ltr;unicode-bidi:isolate;color:var(--tx2);word-break:break-all}
.ms-row .ok{color:var(--ac)}.ms-row .bad{color:var(--danger)}
.ms-cand{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.ms-cand h5{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.ms-cand ol{margin:6px 0 8px;padding-inline-start:22px;font-size:13px;color:var(--tx2)}
.ms-cand ol li{margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1000px){ .tr-grid{grid-template-columns:minmax(0,1fr)} .tr-hero{position:static} }
@media (max-width:760px){
  .tr-ttl h1{font-size:21px}
  .seg.tr-tabs{width:100%}.seg.tr-tabs button{flex:1;justify-content:center;padding:0 6px}
  .tr-th{width:64px;height:48px}
  .tr-hero h2{font-size:18px}
  .tr-hi{aspect-ratio:2/1}
  .tr-th{display:none}
}
/* الحصص اليومية */
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px;margin-top:8px}
.q-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line)}
.q-card.ok{border-top-color:var(--ac)}.q-card.warn{border-top-color:#e08a00}.q-card.bad{border-top-color:var(--danger)}
.q-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.q-acc{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--hover);color:var(--tx2);white-space:nowrap;cursor:help}
.q-acc.official{background:var(--ac2);color:var(--ac3)}.q-acc.live{background:#e6eefb;color:var(--later)}.q-acc.na{opacity:.7}
.q-n{display:flex;align-items:baseline;gap:4px;font-size:13px;color:var(--tx2)}.q-n b{color:var(--tx);font-size:16px}.q-n .sp{flex:1}
.q-bar{height:7px;border-radius:5px;background:var(--line2);overflow:hidden}.q-bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.q-card.warn .q-bar i{background:#e08a00}.q-card.bad .q-bar i{background:var(--danger)}
.q-sub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2)}.q-sub span{flex:1}.q-sub b{color:var(--tx);font-weight:600}
.q-sub i{font-style:normal;font-size:11px}.q-sub i.warn{color:#e08a00}.q-sub i.bad{color:var(--danger)}
.q-err{font-size:12px;color:var(--danger);display:flex;gap:4px;align-items:flex-start}.q-err .ico{width:14px;height:14px;flex:none} .q-err.bill{color:#9a5b00}[data-theme="dark"] .q-err.bill{color:#e9b45c} .q-tw{overflow-x:auto}.q-em{display:none} @media(max-width:560px){.q-em{display:table-row}.q-em td{padding-bottom:0;font-weight:600;color:var(--tx);overflow-wrap:anywhere}.q-em+tr td{border-top:0}.q-tbl tr>:first-child:not([colspan]){display:none}}
.q-tbl{width:100%;border-collapse:collapse;font-size:13px}.q-tbl th,.q-tbl td{padding:6px 4px;border-top:1px solid var(--line);text-align:start}.q-tbl th{color:var(--tx2);font-weight:600}
.q-warn{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 12px;padding:10px 12px;border:1px solid #f0c27a;background:#fff6e6;color:#7a4b00;border-radius:10px;font:inherit;font-size:13.5px;cursor:pointer;text-align:start}
.q-warn .sp{flex:1}.q-warn.bad{border-color:#e9a39c;background:#fdeceb;color:#8c1f16}
[data-theme="dark"] .q-warn{background:#2e2410;border-color:#5e4718;color:#f2c879}[data-theme="dark"] .q-warn.bad{background:#2f1513;border-color:#6b2a24;color:#f1a49c}
[data-theme="dark"] .q-acc.live{background:#16233a}
</style>

/* =========================================================

const DUP_LEVELS = { off: 0, strict: .62, mid: .5, loose: .4 };

  + 'عاجل فيديو بالفيديو صور بالصور شاهد تقرير خاص مباشر بث اليوم امس الان جديد ايضا وفق نحو '
  + 'the a an of to in on for and or is are at by with from as after over new says video').split(' '));

  const out = new Set();
  const t = normAr(title).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\p{L}\p{N}\s]/gu, ' ');
  for (let w of t.split(/\s+/)) {

  const of = new Map(), groups = new Map(); DUP = { sig, of, groups };
  if (!th) return DUP;

  const tk = new Map(), df = new Map();
  for (const it of items) tk.set(it.id, dupToks(it.title));

/* =========================================================

/* =========================================================
   العرض
   ========================================================= */
// المجلدات بمستويين: مجلد رئيسي وبداخله مجلدات فرعية (الحقل parent)، والفرعي لا يضم مجلدات
function parentOf(fid) { const fo = S.folders && S.folders[fid], p = fo && fo.parent; return p && p !== fid && S.folders[p] && !S.folders[p].parent ? p : ''; }

  for (const it of ITEMS.values()) {
    const f = S.feeds[it.feedId]; if (!f || isRead(it.id)) continue;
    const m = matchRules(it); m.forEach(r => rule[r.id] = (rule[r.id] || 0) + 1);
    if (m.some(r => r.action === 'hide')) continue;

function currentItems(opts = {}) {
  let list;

  if (VIEW.type === 'tag') {
    list = Object.entries(S.itags || {}).filter(([, t]) => t && t[VIEW.id]).map(([id]) => getItem(id)).filter(Boolean).map(it => ITEMS.get(it.id) || it);
  } else if (VIEW.type === 'starred' || VIEW.type === 'later') {
    const f = VIEW.type === 'starred' ? 's' : 'l';
    list = Object.values(S.saved || {}).filter(it => st(it.id)[f]).map(it => ITEMS.get(it.id) || it);
  } else {
    list = [...ITEMS.values()].filter(it => S.feeds[it.feedId]);
    if (VIEW.type === 'feed') list = list.filter(it => it.feedId === VIEW.id);
    if (VIEW.type === 'latest') list = list.filter(latestOk);
    if (VIEW.type === 'folder') list = list.filter(it => inFolder(S.feeds[it.feedId].folder, VIEW.id));
    if (VIEW.type === 'rule') {
      // صفحة الفلتر: كل المقالات المطابقة للقاعدة (حتى لو كانت قاعدة إخفاء أو معطّلة)
      const r = S.rules[VIEW.id]; const pr = r ? prepRule(VIEW.id, r) : null;
      list = pr ? list.filter(it => ruleHit(pr, it)) : [];
    } else list = list.filter(it => !isHidden(it));
    if (HELD.size && !opts.held) list = list.filter(it => !HELD.has(it.id) || it.id === SEL);
    if (setting('listFilter') === 'unread' && !opts.all) list = list.filter(it => !isRead(it.id) || it.id === SEL || KEEP_VIS.has(it.id));
    list = dedupeByLink(list);

const _tpl = document.createElement('template');
function patchList(box, rows) {
  const want = new Map(); rows.forEach(h => { const m = /data-item="([^"]*)"/.exec(h); want.set(m ? m[1] : h, h); });
  const keep = new Map();
  for (const n of [...box.childNodes]) {
    const id = n._h != null && n.dataset ? n.dataset.item : null;
    if (id != null && want.get(id) === n._h && !keep.has(id)) keep.set(id, n); else n.remove();
  }
  let cur = box.firstChild;
  for (const [id, h] of want) {
    let el = keep.get(id);
    if (el) { const c = /^<div class="([^"]*)"/.exec(h); if (c && el.className !== c[1].replace(/&amp;/g, '&')) el.className = c[1]; } // ما غيّرته الصفحة مباشرة (مثل sel)
    else { _tpl.innerHTML = h; el = _tpl.content.firstElementChild; el._h = h; }
    if (el === cur) cur = cur.nextSibling; else box.insertBefore(el, cur);
  }
}

/* =========================================================
   وحدة المقالة: الوسوم، الملاحظات، البيانات، شكل النص، المشاركة، التلخيص
   ========================================================= */
const PROG = new Map();   // تقدّم القراءة لكل مقالة (0..1)
/* التقدّم يُقاس بأسطر نص المقالة: النسبة = الأسطر التي ظهرت على الشاشة ÷ كل أسطر النص.
   لا يعمل العداد إلا مع نص حقيقي: 3 أسطر على الأقل في جسم المقالة، وليس مقتطفاً مقطوعاً.
   الأسطر الظاهرة لحظة الفتح لا تُحسب إلا بعد 3 ثوانٍ من بقاء المقالة مفتوحة، أو عند أول تمرير. */
let PROG_OPEN = { id: null, t: 0 };
const PROG_SEL = 'p,li,h2,h3,h4,h5,h6,blockquote,pre,td,dd,dt';
const isCut = t => /(…|\.\.\.|\[\s*(…|\.\.\.)\s*\]|اقرأ المزيد|قراءة المزيد|للمزيد|read more|continue reading)\s*[.»"']?\s*$/i.test((t || '').trim());
function progLines(r) {
  const body = $('.art-body', r); if (!body || body.querySelector('.no-body')) return null;
  let els = [...body.querySelectorAll(PROG_SEL)].filter(e => !e.closest('figure,figcaption') && !e.querySelector(PROG_SEL) && (e.textContent || '').trim().length > 1);
  if (!els.length && (body.textContent || '').trim()) els = [body];
  const vb = Math.min(r.getBoundingClientRect().bottom, innerHeight);
  let total = 0, seen = 0;
  for (const e of els) {
    const b = e.getBoundingClientRect(); if (!b.height) continue;
    const cs = getComputedStyle(e), lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 16) * 1.6;
    const n = Math.max(1, Math.round(b.height / lh)); total += n;
    if (b.bottom <= vb + 2) seen += n; else if (b.top < vb) seen += Math.min(n, Math.max(0, Math.floor((vb - b.top) / lh)));
  }
  return { total, seen, cut: isCut(body.textContent) && !FULLTEXT.has(SEL) };
}
function progRing(p, mode) {
  const done = mode === 'track' && p >= .98;
  const mid = mode === 'none' ? '<circle class="dt" cx="12.5" cy="18" r="1.6"/><circle class="dt" cx="18" cy="18" r="1.6"/><circle class="dt" cx="23.5" cy="18" r="1.6"/>'
    : done ? '<path class="ck" d="M11.5 18.5l4.5 4.5 8.5-9.5"/>'
    : `<text x="18" y="18" dy="0.35em" text-anchor="middle">${Math.round(p * 100)}</text>`;
  return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle class="bg" cx="18" cy="18" r="15"/>${mode === 'none' ? '' : `<circle class="v" cx="18" cy="18" r="15" transform="rotate(-90 18 18)" style="stroke-dashoffset:${(94.25 * (1 - p)).toFixed(2)}"/>`}${mid}</svg>`;
}
// fromScroll: بعد تمرير فعلي تُحسب الأسطر الظاهرة فوراً؛ وإلا فبعد 3 ثوانٍ من الفتح
function progUpdate(fromScroll) {
  const r = $('#reader'), g = $('.r-prog', r), id = SEL; if (!g || !id) return;
  const L = progLines(r);
  if (!L || L.total < 3 || L.cut) {
    g.className = 'r-prog none'; g.title = 'لا يوجد نص كافٍ لحساب التقدّم. اضغط لجلب النص الكامل';
    g.innerHTML = progRing(0, 'none'); return;
  }
  let p = progOf(id);
  if (fromScroll || (PROG_OPEN.id === id && Date.now() - PROG_OPEN.t >= 3000)) {
    const q = L.seen >= L.total ? 1 : L.seen / L.total;
    if (q > p) { p = q; PROG.set(id, p); saveProg(id); }
  }
  g.className = 'r-prog' + (p >= .98 ? ' done' : ''); g.title = `تقدّم القراءة: ${Math.round(p * 100)}% من أسطر النص`;
  g.innerHTML = progRing(p, 'track');
}
/* النص الكامل لمقالات «لاحقاً» والنجمة يُحفظ أيضاً على الجهاز (KV)، فيبقى بعد خروج الخبر من الخلاصة ودون اتصال */
function fullStore(id, res) {
  const full = { html: (res.html || '').slice(0, 60000), image: res.image || '' };
  FULLTEXT.set(id, full);
  const x = ITEMS.get(id); if (x) { x.full = full; delete x.fErr; ogSave(x.feedId); }
  if (st(id).l || st(id).s) KV.put('full_' + id, full);
  return full;
}
async function fullRestore(id) {
  if (FULLTEXT.has(id) || !(st(id).l || st(id).s)) return;
  const f = await KV.get('full_' + id);
  if (f && f.html && !FULLTEXT.has(id)) { FULLTEXT.set(id, f); if (SEL === id) renderReader(); }
}
// التقدّم يُحفظ في الحساب (states/<id>/p) لمقالات «لاحقاً» فقط، فيبقى بعد التحديث وعلى كل الأجهزة
const progOf = id => Math.max(PROG.get(id) || 0, st(id).p || 0);
const _progT = {};
function saveProg(id) {
  clearTimeout(_progT[id]);
  _progT[id] = setTimeout(() => { const p = Math.round(progOf(id) * 100) / 100; if (st(id).l && p > (st(id).p || 0)) Store.write(`states/${id}/p`, p); }, 2500);
}
const SUMS = new Map(lsGet('s24r_sums', []));   // الملخصات المحفوظة في هذا المتصفح
const saveSums = () => lsSet('s24r_sums', [...SUMS].filter(([, v]) => v.text).slice(-150).map(([k, v]) => [k, { text: v.text }]));
const hasExtras = id => itemTagIds(id).length > 0 || !!(S.notes || {})[id];
function itemTagIds(id) { const t = (S.itags || {})[id] || {}; return Object.keys(t).filter(k => t[k] && (S.tags || {})[k]); }
function tagsSorted() { return Object.entries(S.tags || {}).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'ar')); }
function tagCounts() { const c = {}; for (const t of Object.values(S.itags || {})) for (const k in (t || {})) if (t[k]) c[k] = (c[k] || 0) + 1; return c; }
// يحفظ نسخة من المقالة ما دام عليها نجمة أو «لاحقاً» أو وسم أو ملاحظة، كي تبقى بعد خروجها من الخلاصة
function syncSaved(id) {
  const it = getItem(id); if (!it) return; const s = st(id);
  const need = !!(s.s || s.l || hasExtras(id)), has = !!(S.saved || {})[id];
  if (need && !has) Store.write('saved/' + id, snapshot(it)); else if (!need && has) Store.write('saved/' + id, null);
}
function readMinutes(it) { const w = wordCount(it); return Math.max(1, Math.round(w / 200)); }

function setTag(id, tid, on) {

function createTag(name) {
  name = name.trim().replace(/\s+/g, ' ').slice(0, 40); if (!name) return null;
  const ex = Object.entries(S.tags || {}).find(([, t]) => normAr(t.name) === normAr(name)); if (ex) return ex[0];
  const tid = uid(); Store.write('tags/' + tid, { name, at: Date.now() }); return tid;
}
function tagsPop(anchor) {
  const it = SEL && getItem(SEL); if (!it) return;
  document.querySelectorAll('.menu,.tagpop').forEach(m => m.remove());
  const pop = document.createElement('div'); pop.className = 'tagpop';
  pop.innerHTML = `<div class="tp-h">وسوم المقالة</div><input class="in" id="tp-q" placeholder="ابحث عن وسم أو أنشئ وسماً جديداً" autocomplete="off"><div class="tp-l"></div>`;
  document.body.appendChild(pop);
  const place = () => { const r = anchor.getBoundingClientRect(); pop.style.top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8) + 'px'; pop.style.left = Math.max(8, Math.min(innerWidth - pop.offsetWidth - 8, r.left + r.width - pop.offsetWidth)) + 'px'; };
  const q = $('#tp-q', pop), box = $('.tp-l', pop);
  const draw = () => {
    const qq = normAr(q.value.trim()), mine = new Set(itemTagIds(it.id));
    const all = tagsSorted().filter(([, t]) => !qq || normAr(t.name).includes(qq));
    const names = new Set(Object.values(S.tags || {}).map(t => normAr(t.name)));
    const sugg = (it.cats || []).filter(c => !names.has(normAr(c)) && (!qq || normAr(c).includes(qq))).slice(0, 8);
    let h = '';
    if (q.value.trim() && !names.has(qq)) h += `<button class="tp-i new" data-new="${esc(q.value.trim())}">${ico('plus')}<span>إنشاء الوسم «${esc(q.value.trim())}»</span></button>`;
    if (sugg.length) h += `<div class="tp-s">${ico('spark')}وسوم مقترحة من المصدر</div>` + sugg.map(c => `<button class="tp-i sug" data-new="${esc(c)}">${ico('tag')}<span>${esc(c)}</span></button>`).join('');
    if (all.length) h += (sugg.length ? `<div class="tp-s">وسومك</div>` : '') + all.map(([tid, t]) => `<button class="tp-i${mine.has(tid) ? ' on' : ''}" data-tid="${esc(tid)}">${ico(mine.has(tid) ? 'check' : 'tag')}<span>${esc(t.name)}</span></button>`).join('');
    if (!h) h = `<div class="tp-e">اكتب اسم وسم ثم اضغط Enter لإنشائه</div>`;

  });

  return lines.map(x => `<p>${esc(x.replace(/\*\*/g, ''))}</p>`).join('');

/* ---------- زر الرجوع (أندرويد والمتصفح) ----------
   التطبيق صفحة واحدة، فكان الرجوع يخرج منه. الآن: سجلّ داخلي للخطوات (NAV) ومدخل «حارس» واحد في سجلّ المتصفح.
   الرجوع يزيل الحارس فيُلتقط هنا: يغلق ما فوق الصفحة، أو يعيد الخطوة السابقة، ثم يعيد الحارس.
   في الصفحة الرئيسية: «اضغط رجوع مرة أخرى للخروج» (ثانيتان بلا حارس، فالضغطة الثانية تخرج فعلاً). */
const NAV = []; let NAV_ON = false, NAV_RESTORE = false, EXIT_AT = 0;
const siteOrigin = u => { try { return new URL(u).origin + '/'; } catch { return ''; } };
const homeView = () => ({ type: setting('start') === 'all' ? 'all' : 'dash' });
const navSnap = () => ({ v: JSON.parse(JSON.stringify(VIEW)), sel: SEL, y: $('#items').scrollTop, dy: $('#dash').scrollTop, ry: SEL ? $('#reader').scrollTop : 0 });
const navKey = s => JSON.stringify(s.v) + '|' + (s.sel || '');
function navArm() { if (NAV_ON && !(history.state && history.state.s24g)) history.pushState({ s24g: 1 }, ''); }
function navPush() {
  if (!NAV_ON || NAV_RESTORE) return;
  const s = navSnap(), top = NAV[NAV.length - 1];
  if (!top || navKey(top) !== navKey(s)) { NAV.push(s); if (NAV.length > 60) NAV.shift(); }
  navArm();
}
function navRestore(s) {
  NAV_RESTORE = true;
  try {
    if (JSON.stringify(s.v) !== JSON.stringify(VIEW)) setView(s.v);
    if (s.sel && getItem(s.sel)) { if (SEL !== s.sel) openItem(s.sel); } else if (SEL) closeReader();
    const y = s.y, dy = s.dy, ry = s.ry;
    requestAnimationFrame(() => { $('#items').scrollTop = y; $('#dash').scrollTop = dy; if (SEL) $('#reader').scrollTop = ry; });
  } finally { NAV_RESTORE = false; }
}
function navBack() {
  // 1) ما فوق الصفحة أولاً
  if (document.querySelector('.menu,.tagpop')) { document.querySelectorAll('.menu,.tagpop').forEach(m => m.remove()); return true; }
  if ($('#ov')) { closeModal(); return true; }
  const sh = document.querySelector('.msheet'); if (sh) { sh.remove(); return true; }
  if (innerWidth <= 760 && $('#side').classList.contains('open')) { $('#side').classList.remove('open'); return true; }
  if ($('#main').classList.contains('srch')) { $('#main').classList.remove('srch'); if (QUERY || $('#q').value) { $('#q').value = ''; QUERY = ''; renderList(); } return true; }
  // 2) الخطوة السابقة (تُتخطى الخطوة المطابقة لما على الشاشة)
  const cur = navKey(navSnap());
  while (NAV.length) { const s = NAV.pop(); if (navKey(s) !== cur) { navRestore(s); return true; } }
  // 3) لا خطوات: إلى الصفحة الرئيسية قبل الخروج
  if (SEL) { closeReader(); return true; }
  const h = homeView(); if (VIEW.type !== h.type) { NAV_RESTORE = true; try { setView(h); } finally { NAV_RESTORE = false; } return true; }
  return false;
}
addEventListener('popstate', e => {
  if (!NAV_ON) return;
  const guarded = !!(e.state && e.state.s24g);
  if (navBack()) { EXIT_AT = 0; if (!guarded) navArm(); return; }
  if (guarded) { history.back(); return; }
  EXIT_AT = Date.now(); toast('اضغط رجوع مرة أخرى للخروج', 2000);
  setTimeout(() => { if (EXIT_AT && Date.now() - EXIT_AT >= 1900) { EXIT_AT = 0; navArm(); } }, 2000);
});
// أي لمسة تعيد الحارس إن غاب، وتمنح Chrome «تفاعل المستخدم» الذي يشترطه كي لا يتخطى مدخل الحارس

function setView(v, sel = null) {

    if (lab && lab.length < 45 && MR_RX.test(lab)) { consider(el, lab); continue; }
    if (el.children.length > 3) continue;
    const t = txt(el); if (t.length < 4 || t.length > 45 || !MR_RX.test(t)) continue;
    consider(el, t);

  // أسماء الأصناف الشائعة (most-read، most-viewed، trending…)
  for (const el of doc.querySelectorAll('[class*="most-read"],[class*="mostread"],[class*="most-viewed"],[class*="mostviewed"],[class*="most-popular"],[id*="most-read"],[id*="mostread"],[id*="most-viewed"],[class*="trending"],[id*="trending"]')) consider(el, 'قائمة باسم ' + (el.id || el.className).toString().slice(0, 30));
  return cands.map(c => ({ label: c.label, sel: mrSelector(c.el, doc), items: mrItems(c.el, pageUrl) })).filter(c => c.sel && c.items.length >= 3)
    .filter((c, i, a) => a.findIndex(x => x.sel === c.sel || x.items.map(y => y.l).join() === c.items.map(y => y.l).join()) === i).slice(0, 6);
}

const byDate = (a, b) => b.date - a.date;

function dashWidget(k, UC) {
  if (k === 'trend') return trendWidget();
  if (k === 'latest') {
    const list = groupDupes([...ITEMS.values()].filter(it => S.feeds[it.feedId] && !isHidden(it) && latestOk(it)).sort(byDate)).slice(0, 8);
    const sel = setting('latestSrc') || {}, cus = Object.keys(sel.folders || {}).length + Object.keys(sel.feeds || {}).length > 0;
    const n = cus ? groupDupes([...ITEMS.values()].filter(it => S.feeds[it.feedId] && !isHidden(it) && !isRead(it.id) && latestOk(it))).length : UC.total;
    return dwBox(k, ico('inbox'), 'عاجل الآن', n ? `${n} غير مقروء` : '', list.length ? list.map(it => dashRow(it, true)).join('') : `<div class="dw-e">لا أخبار بعد. اضغط تحديث لجلب أحدث المقالات.</div>`, allLink(cus ? 'latest' : 'all'), true);
  }
  if (k === 'later') {
    const all = Object.values(S.saved || {}).filter(it => st(it.id).l).map(it => ITEMS.get(it.id) || it);
    const open = all.filter(it => progOf(it.id) < .98).sort((a, b) => (st(b.id).t || 0) - (st(a.id).t || 0));
    const done = all.length - open.length;
    const body = open.length ? open.slice(0, 6).map(it => { const p = progOf(it.id);
      return dashRow(it, false, `<div class="dw-pg"><i><b style="width:${Math.round(p * 100)}%"></b></i><span>${p > .01 ? Math.round(p * 100) + '%' : 'لم تبدأ'}</span></div>`); }).join('')
      : `<div class="dw-e">${all.length ? 'أكملت كل ما حفظته للقراءة لاحقاً.' : 'احفظ مقالة طويلة بزر الساعة لتقرأها لاحقاً، وستظهر هنا مع نسبة ما قرأت منها.'}</div>`;
    return dwBox(k, ico('clock'), 'قيد القراءة', all.length ? `${open.length} قيد القراءة${done ? ` · ${done} مكتملة` : ''}` : '', body, all.length ? allLink('later') : '');
  }
  if (k.startsWith('rule:')) {

    const un = list.filter(it => !isRead(it.id)).length;
    return dwBox(k, `<span class="dw-sw" style="background:${esc(r.color || '#999')}"></span>`, esc(r.name), `${list.length} مطابقة${un ? ` · ${un} غير مقروءة` : ''}${r.enabled === false ? ' <span class="dw-off">معطّل</span>' : ''}`,
      list.length ? list.slice(0, 6).map(it => dashRow(it)).join('') : `<div class="dw-e">لا مقالات مطابقة: ${esc(ruleCondText(r))}</div>`, allLink('rule', rid));
  }
  if (k === 'drafts') {
    const list = draftsSorted().slice(0, 5);
    const body = list.length ? list.map(([id, d]) => `<div class="dw-i" data-act="open-draft" data-id="${esc(id)}"><div class="dw-m">
        <div class="dw-t" style="color:var(--tx);font-weight:600">${esc(d.title || 'بلا عنوان')}</div>
        <div class="dw-s">${ico('pen')}<span>${timeAgo(d.updatedAt || d.createdAt)}</span>${d.sourceUrl ? `<span class="src">· ${esc(d.feedTitle || hostOf(d.sourceUrl))}</span>` : ''}</div>
        ${d.body ? `<div class="dw-x">${esc(d.body.slice(0, 150))}</div>` : ''}</div></div>`).join('')
      : `<div class="dw-e">لا مسودات. اكتب ملاحظة جديدة، أو حوّل أي خبر إلى مسودة بزر ${ico('pen')} في شريط المقالة.</div>`;
    return dwBox(k, ico('pen'), 'آخر المسودات', Object.keys(S.drafts || {}).length ? `${Object.keys(S.drafts).length} مسودة` : '', body, `<button class="lnk" data-act="new-draft">+ مسودة جديدة</button>`);
  }
  if (k === 'sources') {
    const feeds = Object.entries(S.feeds).map(([id, f]) => ({ id, f, n: UC.feed[id] || 0, err: FEED_STATUS[id] && FEED_STATUS[id].error }))
      .sort((a, b) => (!!b.err - !!a.err) || (b.n - a.n) || (a.f.title || '').localeCompare(b.f.title || '', 'ar'));
    const errs = feeds.filter(x => x.err).length, last = lsGet('s24r_last_refresh', 0);
    const body = feeds.slice(0, 10).map(({ id, f, n, err }) => `<div class="dw-f" data-view="feed" data-id="${esc(id)}" title="${esc(err || f.url)}">
        <img src="${esc(favicon(f.siteUrl || f.url))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <span class="lbl">${esc(f.title || hostOf(f.url))}</span>${err ? '<span class="bad">متوقف</span>' : ''}<span class="cnt">${n || ''}</span></div>`).join('')
      + `<div class="dw-foot"><span>${feeds.length} مصدر${errs ? ` · <b style="color:var(--danger)">${errs} متوقف</b>` : ''}</span><span class="sp" style="flex:1"></span><span>${last ? 'آخر تحديث ' + timeAgo(last) : ''}</span></div>`;
    return dwBox(k, ico('rss'), 'حالة المصادر', '', body, `<button class="lnk" data-act="rail" data-k="feeds">كل المصادر</button>`);
  }
  return '';
}

// تعليم مجموعة مقالات كمقروءة مع إمكانية التراجع
function markRead(list, label) {
  const upd = {}, prev = {}; const now = Date.now();
  if (setting('dupRead')) { const m = new Map(list.map(it => [it.id, it])); for (const it of list) for (const x of dupGroup(it.id) || []) m.set(x.id, x); list = [...m.values()]; }
  list.forEach(it => { if (!isRead(it.id)) { const k = 'states/' + it.id; prev[k] = S.states[it.id] ? { ...S.states[it.id] } : null; upd[k] = { ...st(it.id), r: 1, t: now }; } });
  const n = Object.keys(upd).length; if (!n) return toast('لا توجد مقالات غير مقروءة هنا');
  Store.update(upd); scheduleRender();
  toastUndo(`عُلِّمت ${n} مقالة كمقروءة${label || ''}`, () => { Store.update(prev); scheduleRender(); });
}

async function checkFeedUrl() {
  const res = $('#af-res'); let url = $('#af-url').value.trim(); if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  res.innerHTML = `<div class="msg ok">جارٍ الفحص…</div>`;
  try {
    const { text, finalUrl } = await fetchText(url);
    const p = parseDoc(text, finalUrl);
    if (p.kind === 'feed') { AF = { options: [{ type: 'rss', url: finalUrl, title: p.title, siteUrl: p.siteUrl, items: p.items }] }; return showAfOptions(); }
    const title = txt(p.doc.querySelector('title')).split(/\s[|\-–—]\s/)[0] || hostOf(finalUrl);
    const opts = [];
    let disc = discoverFeeds(p.doc, finalUrl);
    if (!disc.length) { // تجربة المسارات الشائعة
      const o = new URL(finalUrl).origin;
      disc = ['/feed', '/rss', '/rss.xml', '/feed.xml', '/feeds/posts/default?alt=rss'].map(x => ({ title: '', url: o + x }));
    }
    const checks = await Promise.all(disc.slice(0, 6).map(async d => {

    }));
    const seen = new Set(); checks.filter(Boolean).forEach(c => { if (!seen.has(c.url)) { seen.add(c.url); opts.push(c); } });
    const scraped = scrapeLinks(p.doc, finalUrl);
    if (scraped.length) opts.push({ type: 'html', url: finalUrl, title, siteUrl: finalUrl, items: scraped });
    if (!opts.length) throw new Error('لم نجد خلاصة RSS ولا عناوين أخبار في هذه الصفحة. جرّب رابط قسم الأخبار مباشرة.');

async function importOpml(file) {
  if (!file) return;
  const x = new DOMParser().parseFromString(await file.text(), 'application/xml');
  const body = x.querySelector('parsererror') ? null : x.querySelector('body');
  if (!body) return toast('ملف OPML غير صالح');
  const upd = {}, existing = new Set(Object.values(S.feeds).map(f => f.url)), byName = {}, K = (p, n) => p + '\u0001' + n;
  Object.entries(S.folders || {}).forEach(([id, f]) => byName[K(parentOf(id), f.name)] = id);
  let n = 0, seq = Date.now();
  const getFolder = (name, parent) => { const k = K(parent, name); if (byName[k]) return byName[k]; const id = byName[k] = uid(); upd['folders/' + id] = { name, order: seq++, parent }; return id; };
  // المستوى الأول مجلد رئيسي، والثاني فرعي، وما هو أعمق يُضم إلى أقرب مجلد فرعي
  const walk = (el, folder, depth) => {
    for (const o of el.children) {
      if (o.tagName.toLowerCase() !== 'outline') continue;
      const url = (o.getAttribute('xmlUrl') || '').trim();
      if (url) {
        if (existing.has(url)) continue; existing.add(url);
        upd['feeds/' + uid()] = { title: o.getAttribute('title') || o.getAttribute('text') || hostOf(url), url, siteUrl: o.getAttribute('htmlUrl') || '', type: o.getAttribute('s24type') === 'html' ? 'html' : 'rss', folder, order: seq++, addedAt: Date.now() }; n++;
      } else {
        const name = (o.getAttribute('title') || o.getAttribute('text') || 'مجلد').trim();
        walk(o, depth === 0 ? getFolder(name, '') : depth === 1 ? getFolder(name, folder) : folder, depth + 1);
      }
    }
  };
  walk(body, '', 0);
  if (!n) return toast('لا مصادر جديدة في الملف');
  Store.update(upd); closeModal(); toast(`استُورد ${n} مصدر`); renderAll(); refreshAll();
}
// استعادة النسخة الاحتياطية الكاملة (JSON): تُضاف إلى البيانات الحالية ولا يُحذف شيء
async function importBackup(file) {

  let d; try { d = JSON.parse(await file.text()); } catch { return toast('ملف النسخة الاحتياطية غير صالح'); }

  const B = typeof d.folders === 'object' && d.folders || {}, fmap = {};
  const bPar = id => { const p = B[id] && B[id].parent; return p && p !== id && B[p] && !B[p].parent ? p : ''; };
  for (const pass of [0, 1]) for (const [id, v] of Object.entries(B)) {
    if (!v || !!bPar(id) !== !!pass || S.folders[id]) continue;
    const par = bPar(id) ? (fmap[bPar(id)] || bPar(id)) : '';
    const ex = Object.keys(S.folders || {}).find(f => S.folders[f].name === v.name && parentOf(f) === par); if (ex) fmap[id] = ex;
  }
  const FM = f => fmap[f] || f || '';

    const src = d[k]; if (!src || typeof src !== 'object') continue;
    for (let [id, v] of Object.entries(src)) {

      if (k === 'feeds') { const ex = urls.get(v.url); if (ex && ex !== id) continue; v = { ...v, folder: FM(v.folder) }; }   // المصدر الموجود عندك أصلاً لا يُكرَّر
      if (k === 'rules' && (v.scope || '').startsWith('folder:')) v = { ...v, scope: 'folder:' + FM(v.scope.slice(7)) };

    }

document.querySelectorAll('.col-rs').forEach(h => {

function startFeedDrag() {

    if (row && row.matches('h4')) { tgt = { folder: '', before: (feedsInFolder('').find(([i]) => i !== d.id) || [])[0] || null }; const fr = row.getBoundingClientRect(); showLine(fr, fr.bottom); }

// سحب مجلد: بين مجلدات المستوى نفسه (أعلى رأس المجلد أو أسفله)، أو إلى داخل مجلد رئيسي (منتصف رأسه) ليصير فرعياً
